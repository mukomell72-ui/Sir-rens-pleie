<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#101214" />
<link rel="manifest" href="manifest.json" />
<title>SIR Rens & Pleie — справочник</title>
<style>
:root{--bg:#0d0f12;--card:#171a1f;--muted:#9aa3ad;--text:#f5f7fa;--line:#2a3038;--accent:#69d59c;--warn:#ffcf66;--bad:#ff7b7b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}button,input{font:inherit}.wrap{max-width:920px;margin:auto;padding:18px 14px 90px}.top{position:sticky;top:0;z-index:8;background:linear-gradient(var(--bg) 82%,transparent);padding:10px 0 18px}.brand{font-size:25px;font-weight:800}.sub{color:var(--muted);margin-top:3px}.search{width:100%;margin-top:14px;background:#14171b;border:1px solid var(--line);color:var(--text);border-radius:14px;padding:14px 15px;outline:none}.chips{display:flex;gap:8px;overflow:auto;padding:11px 0 2px}.chip{white-space:nowrap;border:1px solid var(--line);background:#14171b;color:var(--text);border-radius:999px;padding:9px 12px}.chip.active{border-color:var(--accent);color:var(--accent)}.count{font-size:13px;color:var(--muted);margin:8px 0 12px}.grid{display:grid;gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}.head{padding:15px;display:grid;grid-template-columns:54px 1fr auto;gap:12px;align-items:center}.badge{width:54px;height:54px;border-radius:13px;display:grid;place-items:center;font-weight:900;font-size:13px;text-align:center;color:#111}.name{font-size:18px;font-weight:800}.meta{font-size:13px;color:var(--muted);margin-top:3px}.open{border:0;background:transparent;color:var(--muted);font-size:24px}.details{display:none;padding:0 15px 16px;border-top:1px solid var(--line)}.card.open .details{display:block}.section{margin-top:14px}.section b{display:block;margin-bottom:5px}.section p{margin:0;color:#e5e9ee;line-height:1.48}.warn{color:var(--warn)!important}.bad{color:var(--bad)!important}.tagrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.tag{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:5px 8px;color:#cbd2da}.price{font-weight:700}.btn{display:inline-block;margin-top:12px;border:1px solid var(--line);border-radius:11px;padding:9px 11px;color:var(--text);text-decoration:none}.empty{padding:28px;text-align:center;color:var(--muted)}.foot{margin-top:20px;color:var(--muted);font-size:12px;line-height:1.45}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">SIR Rens & Pleie</div>
    <div class="sub">Мобильный справочник по автохимии и оборудованию</div>
    <input id="q" class="search" placeholder="Поиск: кузов, текстиль, битум, шины, пластик…" />
    <div id="chips" class="chips"></div>
  </div>
  <div id="count" class="count"></div>
  <div id="list" class="grid"></div>
  <div class="foot">Справочник восстановлен в GitHub. В него внесены только позиции, которые подтверждены в нашей текущей истории. Непроверенные цены и точные ссылки не выдумываются — их можно добавлять после проверки.</div>
</div>
<script>
const items=[
 {n:'Koch Chemie Green Star',c:'Салон',col:'#9BE564',for:'Щелочной универсальный очиститель для сильной грязи на стойких поверхностях, в том числе текстиле и пластике при правильном разведении.',d:'Для салона начинать с мягкого раствора 1:20–1:30. Для сильной грязи — только после теста на незаметном участке.',use:'Нанести на щётку или распылителем очень умеренно. Проработать, не давать высыхать, затем удалить экстрактором или влажной микрофиброй.',next:'После щёлочи на чувствительных поверхностях нужен тщательный сбор остатков и нейтральное ополаскивание.',warn:'На пластике при слишком сильной концентрации может оставить белёсые следы. Не применять на горячей поверхности.',tags:['текстиль','ковролин','пластик','сильная грязь']},
 {n:'Koch Chemie Reactive Rustremover 500 ml',c:'Кузов',col:'#F2D25C',for:'Удаление металлических вкраплений и ржавого налёта с кузова и дисков.',d:'Готов к применению. Не смешивать с шампунем.',use:'Нанести на прохладную очищенную поверхность. Дождаться реакции, не допуская высыхания, затем тщательно смыть.',next:'После удаления металлических частиц — обычная мойка/шампунь, затем защита при необходимости.',warn:'Не работать на горячем кузове и под прямым солнцем.',tags:['кузов','диски','металлические вкрапления','ржавый налёт']},
 {n:'Koch Chemie NanoMagic Shampoo 5 L',c:'Кузов',col:'#5EC8F2',for:'pH-нейтральный шампунь для регулярной мойки кузова и ухода за защищёнными поверхностями.',d:'Разводить по инструкции производителя на канистре. Для ручной мойки использовать отдельное ведро с чистой водой для ополаскивания рукавицы.',use:'Предварительно смыть основную грязь. Мыть сверху вниз на прохладном кузове, не давать раствору высыхать.',next:'После мойки — аккуратная сушка. При необходимости наносить отдельную защиту.',warn:'Не заменяет щелочной prewash при тяжёлой дорожной грязи.',tags:['кузов','шампунь','нейтральный pH','керамика']},
 {n:'Koch Chemie Plast Star Silicone-Free 1 L',c:'Пластик',col:'#E0E0E0',for:'Уход и восстановление внешнего пластика и резиновых элементов без силикона.',d:'Готов к применению.',use:'Нанести небольшое количество на аппликатор, распределить тонким слоем по чистой сухой поверхности и выровнять микрофиброй.',next:'Отдельная защита обычно не требуется сразу после нанесения.',warn:'Не наносить на руль, педали и поверхности, где скольжение опасно.',tags:['наружный пластик','резина','восстановление цвета']},
 {n:'CarPro Retyre',c:'Колёса',col:'#C8A36A',for:'Глубокая очистка боковины шины перед нанесением чернения или защиты.',d:'Готов к применению.',use:'Нанести на мокрую или слегка влажную шину, проработать жёсткой щёткой до удаления старых силиконов и дорожной плёнки, затем тщательно смыть.',next:'После полного высыхания шины нанести CarPro DarkSide.',warn:'Предназначен для резины шин, а не для окрашенных дисков.',tags:['шины','очистка резины','подготовка']},
 {n:'CarPro DarkSide',c:'Колёса',col:'#7A7A7A',for:'Финишное чернение и защита боковины шин.',d:'Готов к применению.',use:'Нанести очень тонко на чистую сухую шину аппликатором. Дать впитаться и убрать избыток.',next:'Повторное нанесение — по состоянию покрытия.',warn:'Не наносить на протектор.',tags:['шины','чернение','защита']},
 {n:'CarPro Essence Plus',c:'Кузов',col:'#F0C7E7',for:'Финишный продукт для улучшения внешнего вида и маскировки лёгких дефектов на защищённом ЛКП; особенно полезен на керамических покрытиях.',d:'Не разводится.',use:'Лучший результат даёт машинное нанесение мягким падом. Ручное нанесение возможно, но коррекция паутины и царапин будет значительно слабее.',next:'После выдержки и располировки соблюдать рекомендации производителя по контакту с водой.',warn:'Это не полноценная абразивная полировальная паста для ручного удаления царапин.',tags:['кузов','блеск','керамика','лёгкие дефекты']},
 {n:'Kärcher FoamStop neutral',c:'Расходники',col:'#F6F2D4',for:'Нейтральный пеногаситель для экстракторов и моющих пылесосов.',d:'Добавлять небольшое количество в бак грязной воды/по инструкции производителя.',use:'Применять, когда в баке обратной воды образуется пена. Не лить в раствор как обычную моющую химию.',next:'После работы промыть бак и систему чистой водой.',warn:'Не является очистителем поверхности.',tags:['экстрактор','пеногаситель','Puzzi']},
 {n:'Kärcher Puzzi 8/1',c:'Оборудование',col:'#FFD84D',for:'Профессиональный экстрактор для промывки текстиля, сидений, ковролина, диванов и матрасов.',d:'Оборудование — разведение зависит от применяемой химии.',use:'Не переувлажнять материал. Наносить раствор контролируемо, прорабатывать и делать несколько проходов на всасывание до минимальной остаточной влаги.',next:'После химии — финальные проходы с чистой водой при необходимости, затем ускоренная сушка.',warn:'Сильно заливать сиденья и ковролин нельзя: повышается риск долгой сушки, запаха и проблем с наполнителем.',tags:['текстиль','сиденья','ковролин','диван','матрас']},
 {n:'AVA P55 Go',c:'Оборудование',col:'#E74C3C',for:'Мойка высокого давления для предварительной и основной наружной мойки.',d:'Оборудование.',use:'Сначала сбить рыхлую грязь. Держать безопасную дистанцию от эмблем, уплотнителей, повреждённой краски и электроразъёмов.',next:'Далее — prewash/шампунь по выбранной схеме.',warn:'Не направлять струю вплотную на повреждённое ЛКП и чувствительные элементы.',tags:['мойка','кузов','колёса','высокое давление']}
];
const cats=['Все','Салон','Кузов','Пластик','Колёса','Оборудование','Расходники'];
let active='Все';
const list=document.getElementById('list'),q=document.getElementById('q'),chips=document.getElementById('chips'),count=document.getElementById('count');
function renderChips(){chips.innerHTML=cats.map(c=>`<button class="chip ${c===active?'active':''}" data-c="${c}">${c}</button>`).join('');chips.querySelectorAll('button').forEach(b=>b.onclick=()=>{active=b.dataset.c;renderChips();render()})}
function card(x){return `<article class="card"><div class="head"><div class="badge" style="background:${x.col}">${x.c}</div><div><div class="name">${x.n}</div><div class="meta">${x.for}</div></div><button class="open">⌄</button></div><div class="details"><div class="section"><b>Для чего</b><p>${x.for}</p></div><div class="section"><b>Разведение</b><p>${x.d}</p></div><div class="section"><b>Как пользоваться</b><p>${x.use}</p></div><div class="section"><b>Что после</b><p>${x.next}</p></div><div class="section"><b>Важно</b><p class="warn">${x.warn}</p></div><div class="tagrow">${x.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div></div></article>`}
function render(){const s=q.value.trim().toLowerCase();const f=items.filter(x=>(active==='Все'||x.c===active)&&(!s||[x.n,x.c,x.for,x.d,x.use,x.next,x.warn,...x.tags].join(' ').toLowerCase().includes(s)));count.textContent=`Найдено: ${f.length} из ${items.length}`;list.innerHTML=f.length?f.map(card).join(''):'<div class="empty">Ничего не найдено</div>';list.querySelectorAll('.card').forEach(c=>c.querySelector('.head').onclick=()=>c.classList.toggle('open'))}
q.oninput=render;renderChips();render();
if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
</body>
</html>
