<!doctype html><html lang="nb"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090d10"><meta name="robots" content="index,follow"><title>SIR Rens & Pleie — Personvern</title><link rel="stylesheet" href="assets/styles.css"></head><body><header class="topbar"><div class="shell"><div class="brand">SIR Rens & Pleie<small>PERSONVERN</small></div><div class="top-actions"><div class="lang"><button data-lang="no" class="active">NO</button><button data-lang="en">EN</button><button data-lang="ru">RU</button></div><a class="btn" href="./" id="back">← Til nettsiden</a></div></div></header><main class="section"><div class="shell" style="max-width:820px"><div class="eyebrow" id="eyebrow">Personvern</div><h1 id="title">Slik behandler SIR personopplysninger</h1><p class="section-lead" id="lead">Kort og konkret informasjon om hvilke opplysninger vi bruker, hvorfor vi trenger dem og hvilke valg og rettigheter du har.</p><div id="content"></div></div></main><script>
(()=>{const data={no:{back:'← Til nettsiden',eyebrow:'Personvern',title:'Slik behandler SIR personopplysninger',lead:'Kort og konkret informasjon om hvilke opplysninger vi bruker, hvorfor vi trenger dem og hvilke valg og rettigheter du har.',sections:[['Behandlingsansvarlig','SIR Rens & Pleie i Kongsberg er behandlingsansvarlig for kundeopplysningene som beskrives her. Kontakt: +47 93 95 35 81 eller +47 48 68 91 64.'],['Hva vi samler inn','Navn, telefon, adresse/område, valgt tjeneste, opplysninger du gir om bilen eller møbelet, kommentarer, bestillings- og betalingsstatus og bilder du selv velger å legge ved. Hvis du oppgir registreringsnummer, kan dette lagres sammen med forespørselen eller ordren. Når du bruker kjøretøyoppslaget, sendes registreringsnummeret via SIRs backend til Statens vegvesen for å hente tekniske kjøretøyopplysninger som merke, modell, år og karosseri. Oppslaget ber ikke om eieropplysninger.'],['Formål og behandlingsgrunnlag','Opplysningene brukes for å svare på forespørselen, vurdere omfang og risiko, beregne pris og tidsbruk, avtale tidspunkt, utføre tjenesten og følge opp kunden. Behandling som er nødvendig for å håndtere forespørselen og gjennomføre avtalen bygger på at den er nødvendig for tiltak på kundens anmodning før avtale og for å oppfylle avtalen. Opplysninger kan også beholdes når det er nødvendig for lovpålagte plikter eller for å dokumentere et krav eller en hendelse.'],['Kjøretøyoppslag','Kjøretøyoppslag er frivillig; registreringsnummer og kjøretøyopplysninger kan også fylles inn manuelt. Ved oppslag mottar Statens vegvesen registreringsnummeret for det konkrete oppslaget. De tekniske opplysningene som returneres brukes til å gjøre bestillingen og prisvurderingen mer presis. SIRs oppslag er begrenset mot misbruk, og tekniske driftslogger kan oppstå hos backendleverandøren.'],['Bilder','Bilder i en forespørsel brukes for vurdering, risikokontroll og dokumentasjon av oppdraget. De lagres privat og er ikke en del av den offentlige nettsiden. Offentlig før/etter-bruk eller markedsføring krever en separat og frivillig avtale; dette er ikke et vilkår for å bestille rens.'],['Hvem får tilgang','Tilgang i SIR styres etter rolle. En medarbeider skal bare få den tilgangen som trengs for arbeidet. SIR bruker tekniske leverandører, blant annet Supabase for database, innlogging og privat bildelagring og GitHub Pages for den offentlige nettsiden. Statens vegvesen mottar registreringsnummeret bare når kjøretøyoppslaget brukes.'],['Lagringstid','Opplysninger beholdes ikke lenger enn formålet, nødvendig dokumentasjon og eventuelle lovpålagte plikter krever. Bilder skal ha kortere lagring enn ordinære ordreopplysninger og slettes når de ikke lenger er nødvendige for vurdering, utførelse eller relevant dokumentasjon. Bekreftelses- og statuslenker har egne utløpsfrister og kan tilbakekalles.'],['Nettleserlagring og sporing','Nettsiden bruker lokal nettleserlagring for nødvendige funksjoner som språkvalg, pågående anbefalingskode og midlertidig ordrestatus. SIR har ikke lagt inn annonse- eller markedsføringssporing i denne versjonen av siden. Tekniske driftslogger kan likevel oppstå hos hosting- og backendleverandører.'],['Dine rettigheter','Du kan be om innsyn i opplysningene vi har om deg, få uriktige opplysninger rettet og be om sletting eller begrensning når vilkårene er oppfylt. I relevante tilfeller kan du også ha rett til dataportabilitet eller til å protestere. Kontakt SIR på telefonnumrene over. Du kan også klage til Datatilsynet dersom du mener personopplysningene behandles i strid med regelverket.'],['Automatiske avgjørelser','SIR bruker ikke automatiserte avgjørelser som alene avgjør om en kunde får tjenesten. Pris og risikovurdering kontrolleres av SIR før endelig avtale ved krevende eller usikre forhold.']]},en:{back:'← Back to site',eyebrow:'Privacy',title:'How SIR processes personal data',lead:'Clear information about what we use, why we need it and what choices and rights you have.',sections:[['Data controller','SIR Rens & Pleie in Kongsberg is responsible for the customer data described here. Contact: +47 93 95 35 81 or +47 48 68 91 64.'],['What we collect','Name, phone number, address/area, selected service, details you provide about the vehicle or furniture, comments, booking/payment status and photos you choose to attach. If you provide a registration number, it may be stored with the request or order. When you use vehicle lookup, the registration number is sent through the SIR backend to Statens vegvesen to retrieve technical vehicle details such as make, model, year and body type. The lookup does not request owner information.'],['Purpose and legal basis','We use the information to answer the request, assess scope and risk, estimate price and time, agree an appointment, perform the service and follow up the customer. Processing needed to handle the request and perform the service is based on steps requested by the customer before entering an agreement and performance of the agreement. Information may also be retained where needed for legal obligations or to document a claim or incident.'],['Vehicle lookup','Vehicle lookup is optional; the registration number and vehicle details can also be entered manually. When lookup is used, Statens vegvesen receives the registration number for that specific lookup. The returned technical details are used to make the booking and price assessment more accurate. SIR limits lookup requests to reduce abuse, and technical operational logs may be created by the backend provider.'],['Photos','Photos attached to a request are used for assessment, risk control and job documentation. They are stored privately and are not part of the public website. Public before/after use or marketing requires a separate voluntary agreement and is not a condition of booking a cleaning service.'],['Who can access the data','SIR access is role-based and staff should only receive the access needed for their work. SIR uses technical providers, including Supabase for database, authentication and private photo storage, and GitHub Pages for the public website. Statens vegvesen receives the registration number only when vehicle lookup is used.'],['Retention','Information is not kept longer than required by the purpose, necessary documentation and applicable legal obligations. Photos should have a shorter retention period than ordinary order data and are removed when no longer needed for assessment, performance or relevant documentation. Confirmation and status links have separate expiry periods and can be revoked.'],['Browser storage and tracking','The site uses local browser storage for necessary functions such as language choice, an active referral code and temporary order status. SIR has not added advertising or marketing tracking to this version of the site. Technical operational logs may still be created by hosting and backend providers.'],['Your rights','You can request access to your personal data, correction of inaccurate data, and deletion or restriction where the legal conditions are met. In relevant cases you may also have rights to data portability or to object. Contact SIR using the phone numbers above. You may also complain to the Norwegian Data Protection Authority (Datatilsynet).'],['Automated decisions','SIR does not use automated decisions that alone determine whether a customer receives the service. Price and risk are reviewed by SIR before final agreement where conditions are difficult or uncertain.']]},ru:{back:'← На сайт',eyebrow:'Конфиденциальность',title:'Как SIR обрабатывает персональные данные',lead:'Кратко и понятно: какие данные используются, зачем они нужны и какие права есть у клиента.',sections:[['Кто отвечает за данные','SIR Rens & Pleie в Kongsberg отвечает за обработку клиентских данных, описанных здесь. Контакты: +47 93 95 35 81 или +47 48 68 91 64.'],['Что собираем','Имя, телефон, адрес/район, выбранную услугу, сведения об автомобиле или мебели, комментарии, статус заказа/оплаты и фотографии, которые вы сами решаете приложить. Если вы указываете регистрационный номер автомобиля, он может храниться вместе с заявкой или заказом. При использовании поиска автомобиля регистрационный номер через backend SIR передаётся Statens vegvesen для получения технических данных: марки, модели, года и типа кузова. Данные о владельце автомобиля этим поиском не запрашиваются.'],['Зачем и на каком основании','Данные нужны, чтобы обработать запрос, оценить объём и риск, рассчитать цену и время, согласовать запись, выполнить услугу и связаться с клиентом. Обработка, необходимая для работы с заявкой и выполнения услуги, основана на действиях по запросу клиента до заключения соглашения и на выполнении самого соглашения. Отдельные данные могут храниться дольше, когда это требуется законом или необходимо для документирования претензии или события.'],['Поиск автомобиля','Поиск автомобиля добровольный: регистрационный номер и данные автомобиля можно указать вручную. При использовании поиска Statens vegvesen получает регистрационный номер для конкретного запроса. Возвращаемые технические данные используются для более точного оформления заказа и оценки цены. SIR ограничивает частоту запросов для защиты от злоупотреблений; у backend-поставщика могут создаваться технические журналы работы.'],['Фотографии','Фотографии из заявки используются для оценки, контроля риска и документирования работы. Они хранятся приватно и не являются частью публичного сайта. Публикация «до/после» или использование в рекламе требует отдельного добровольного согласования и не является условием заказа услуги.'],['Кто имеет доступ','Доступ сотрудников SIR определяется ролью и должен ограничиваться тем, что требуется для работы. Для технической инфраструктуры используются в том числе Supabase — база, вход и приватное хранение фото — и GitHub Pages для публичного сайта. Statens vegvesen получает регистрационный номер только при использовании поиска автомобиля.'],['Срок хранения','Данные не хранятся дольше, чем требуют цель обработки, необходимая документация и применимые обязанности по закону. Фотографии должны храниться меньше обычных данных заказа и удаляться, когда они больше не нужны для оценки, выполнения или необходимого документирования. Ссылки подтверждения и статуса имеют отдельные сроки действия и могут быть отозваны.'],['Хранилище браузера и отслеживание','Сайт использует локальное хранилище браузера для необходимых функций: выбора языка, активного реферального кода и временных данных статуса заказа. В эту версию сайта SIR не добавлял рекламное или маркетинговое отслеживание. Технические журналы работы могут создаваться у поставщиков хостинга и backend.'],['Ваши права','Вы можете запросить доступ к своим данным, исправление неверных данных, а при выполнении установленных условий — удаление или ограничение обработки. В соответствующих случаях могут действовать права на переносимость данных или возражение. Свяжитесь с SIR по телефонам выше. Также можно подать жалобу в Datatilsynet, если вы считаете, что данные обрабатываются с нарушением правил.'],['Автоматические решения','SIR не использует автоматические решения, которые сами по себе определяют, будет ли клиенту оказана услуга. При сложных или сомнительных условиях цена и риск проверяются SIR до окончательного согласования.']]}};const $=id=>document.getElementById(id);let lang=localStorage.getItem('sir_lang')||'no';if(!data[lang])lang='no';function render(){const d=data[lang];document.documentElement.lang=lang==='no'?'nb':lang;$('back').textContent=d.back;$('eyebrow').textContent=d.eyebrow;$('title').textContent=d.title;$('lead').textContent=d.lead;$('content').innerHTML=d.sections.map(([h,p])=>`<div class="info-card" style="margin-top:12px"><b>${h}</b><p>${p}</p></div>`).join('');document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));}document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>{lang=b.dataset.lang;localStorage.setItem('sir_lang',lang);render();}));render();})();
</script></body></html>
