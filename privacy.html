<!doctype html><html lang="nb"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090d10"><title>SIR Rens & Pleie — Personvern</title><link rel="stylesheet" href="assets/styles.css"></head><body><header class="topbar"><div class="shell"><div class="brand">SIR Rens & Pleie<small>PERSONVERN</small></div><div class="top-actions"><div class="lang"><button data-lang="no" class="active">NO</button><button data-lang="en">EN</button><button data-lang="ru">RU</button></div><a class="btn" href="./" id="back">← Til nettsiden</a></div></div></header><main class="section"><div class="shell" style="max-width:820px"><div class="eyebrow" id="eyebrow">Personvern</div><h1 id="title">Slik bruker SIR opplysninger i en forespørsel</h1><p class="section-lead" id="lead">Vi samler bare opplysninger som trengs for å vurdere, avtale og gjennomføre oppdraget. Bilder brukes ikke offentlig uten en egen avtale.</p><div id="content"></div></div></main><script>
(()=>{const data={no:{back:'← Til nettsiden',eyebrow:'Personvern',title:'Slik bruker SIR opplysninger i en forespørsel',lead:'Vi samler bare opplysninger som trengs for å vurdere, avtale og gjennomføre oppdraget. Bilder brukes ikke offentlig uten en egen avtale.',sections:[['Hva vi samler inn','Navn, telefon, adresse/område, valgt tjeneste, relevante opplysninger om bilen, kommentarer og bilder kunden selv legger ved.'],['Hvorfor','For å vurdere omfang, risiko, arbeidsmetode, tidsbruk og pris, avtale tidspunkt, kontakte kunden og dokumentere oppdraget.'],['Tilgang og sikkerhet','Ordredata er beregnet for autoriserte SIR-medarbeidere etter rolle. Kundebilder lagres privat og publiseres ikke automatisk.'],['Bilder','Bilder som sendes med forespørselen brukes for vurdering og gjennomføring av oppdraget. Markedsføring eller offentlig før/etter-bruk krever en separat avtale.'],['Bilopplysninger','Når automatisk oppslag på registreringsnummer aktiveres, brukes bare opplysninger som er relevante for å identifisere bilen og beregne arbeidet. Kilden oppgis i tjenesten.'],['Lagring','Opplysninger skal ikke lagres lenger enn nødvendig for oppdraget, nødvendig dokumentasjon og eventuelle lovpålagte plikter. Bilder skal ha en kortere, separat lagringsperiode i SIR-innstillingene.'],['Dine spørsmål','For spørsmål om opplysninger eller ønske om retting/sletting kan du kontakte SIR på +47 93 95 35 81 eller +47 48 68 91 64.']]},en:{back:'← Back to site',eyebrow:'Privacy',title:'How SIR uses information in a request',lead:'We collect only the information needed to assess, agree and carry out the job. Photos are not used publicly without a separate agreement.',sections:[['What we collect','Name, phone number, address/area, selected service, relevant vehicle details, comments and photos voluntarily attached by the customer.'],['Why','To assess scope, risk, work method, time and price, agree a time, contact the customer and document the job.'],['Access and security','Order data is intended for authorised SIR staff according to role. Customer photos are stored privately and are not published automatically.'],['Photos','Photos sent with a request are used to assess and perform the service. Marketing or public before/after use requires a separate agreement.'],['Vehicle data','When registration-number lookup is enabled, only information relevant to identifying the vehicle and estimating the work is used. The source is shown in the service.'],['Retention','Information should not be kept longer than necessary for the job, necessary documentation and applicable legal obligations. Photos should have a shorter, separate retention period in SIR settings.'],['Questions about your data','For questions, correction or deletion requests, contact SIR at +47 93 95 35 81 or +47 48 68 91 64.']]},ru:{back:'← На сайт',eyebrow:'Конфиденциальность',title:'Как SIR использует данные заявки',lead:'Мы собираем только данные, необходимые для оценки, согласования и выполнения заказа. Фотографии не используются публично без отдельного согласования.',sections:[['Что собираем','Имя, телефон, адрес/район, выбранную услугу, необходимые данные автомобиля, комментарии и фотографии, которые клиент сам прикладывает.'],['Зачем','Чтобы оценить объём, риск, технологию, время и цену, согласовать дату, связаться с клиентом и документировать работу.'],['Доступ и безопасность','Данные заказов предназначены только для авторизованных сотрудников SIR согласно их роли. Фотографии клиентов хранятся приватно и автоматически не публикуются.'],['Фотографии','Фото из заявки используются для оценки и выполнения работы. Публикация или маркетинговое использование «до/после» требует отдельного согласования.'],['Данные автомобиля','Когда будет включён автоматический поиск по регистрационному номеру, используются только данные, нужные для идентификации автомобиля и расчёта работы. Источник указывается в сервисе.'],['Срок хранения','Данные не должны храниться дольше, чем требуется для заказа, необходимой документации и применимых обязательств. Для фотографий в SIR устанавливается отдельный, более короткий срок.'],['Вопросы по данным','Для исправления, удаления или вопросов по данным: +47 93 95 35 81 или +47 48 68 91 64.']]}};const $=id=>document.getElementById(id);let lang=localStorage.getItem('sir_lang')||'no';if(!data[lang])lang='no';function render(){const d=data[lang];document.documentElement.lang=lang==='no'?'nb':lang;$('back').textContent=d.back;$('eyebrow').textContent=d.eyebrow;$('title').textContent=d.title;$('lead').textContent=d.lead;$('content').innerHTML=d.sections.map(([h,p])=>`<div class="info-card" style="margin-top:12px"><b>${h}</b><p>${p}</p></div>`).join('');document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));}document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>{lang=b.dataset.lang;localStorage.setItem('sir_lang',lang);render();}));render();})();
</script></body></html>
