<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090d10"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><title>SIR Rens & Pleie — Bekreft tilbud</title><style>:root{--bg:#090d10;--card:#121a1f;--line:#293942;--text:#f6f8f9;--muted:#9fb0ba;--accent:#36d3bf;--blue:#40a8d0;--red:#ff7474;--yellow:#f3c765}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#15303a55,transparent 35%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial}.wrap{max-width:650px;margin:auto;padding:24px 16px 70px}.brand{font-weight:950;font-size:20px}.brand small{display:block;color:var(--accent);font-size:11px;letter-spacing:.12em}.langs{display:flex;gap:6px;justify-content:flex-end}.langs button{border:1px solid var(--line);background:#121a1f;color:var(--muted);border-radius:999px;padding:7px 9px}.langs .active{color:var(--text);border-color:var(--accent)}h1{font-size:34px;margin:28px 0 8px}.lead{color:var(--muted);line-height:1.5}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:17px;margin-top:16px}.row{display:flex;justify-content:space-between;gap:20px;padding:10px 0;border-bottom:1px solid #ffffff0b}.row:last-child{border:0}.row span{color:var(--muted)}.row b{text-align:right}.price{font-size:28px;color:var(--accent)}.actions{display:grid;gap:10px;margin-top:18px}.btn{width:100%;min-height:50px;border-radius:14px;border:1px solid var(--line);background:#17232a;color:var(--text);font-weight:900;font-size:16px;padding:12px;cursor:pointer}.btn.primary{border:0;background:linear-gradient(135deg,var(--accent),var(--blue));color:#071012}.btn.danger{border-color:#ff747455;color:#ffb0b0;background:#ff74740d}.field{margin-top:14px}.field label{display:block;font-weight:800;margin-bottom:7px}.field textarea{width:100%;min-height:90px;background:#0c1317;border:1px solid var(--line);color:var(--text);border-radius:12px;padding:12px;font:inherit}.notice{margin-top:16px;border:1px solid #36d3bf45;background:#36d3bf0d;border-radius:14px;padding:13px;line-height:1.45}.error{border-color:#ff747455;background:#ff74740d;color:#ffc0c0}.hidden{display:none}.status{font-weight:900;color:var(--yellow)}@media(max-width:480px){h1{font-size:29px}.row{align-items:flex-start}.row b{max-width:58%}}</style></head><body><main class="wrap"><div style="display:flex;justify-content:space-between;align-items:start;gap:12px"><div class="brand">SIR Rens & Pleie<small>KONGSBERG</small></div><div class="langs"><button data-lang="no" class="active">NO</button><button data-lang="en">EN</button><button data-lang="ru">RU</button></div></div><h1 id="title">Bekreft tilbudet</h1><p class="lead" id="lead">Kontroller tidspunkt, pris og sted før du bekrefter.</p><div id="loading" class="card">Laster tilbud…</div><section id="offer" class="hidden"><div class="card" id="details"></div><div id="responseBox"><div class="field hidden" id="newTimeBox"><label id="newTimeLabel" for="requested">Hvilket tidspunkt passer bedre?</label><textarea id="requested" placeholder="Skriv ønsket dag og tidspunkt"></textarea></div><div class="actions"><button class="btn primary" id="confirmBtn">Bekreft</button><button class="btn" id="newTimeBtn">Et annet tidspunkt</button><button class="btn danger" id="cancelBtn">Avbestill</button></div></div><div id="message" class="notice hidden"></div></section></main><script src="../assets/config.js"></script><script>
(()=>{const C=window.SIR_CONFIG,q=new URLSearchParams(location.search),orderNo=q.get('o')||'',token=q.get('t')||'';let lang=(navigator.language||'no').toLowerCase().startsWith('ru')?'ru':'no',offer=null;const txt={no:{title:'Bekreft tilbudet',lead:'Kontroller tidspunkt, pris og sted før du bekrefter.',service:'Tjeneste',when:'Tid',place:'Sted',duration:'Estimert tid',price:'Avtalt pris',confirm:'Bekreft',newTime:'Et annet tidspunkt',cancel:'Avbestill',ask:'Hvilket tidspunkt passer bedre?',placeholder:'Skriv ønsket dag og tidspunkt',confirmed:'Takk. Bestillingen er bekreftet.',requested:'Forespørselen er sendt. SIR kontakter deg med nytt tidspunkt.',cancelled:'Bestillingen er avbestilt.',bad:'Lenken er ugyldig eller utløpt.',status:'Status'},en:{title:'Confirm your offer',lead:'Check the time, price and location before confirming.',service:'Service',when:'Time',place:'Location',duration:'Estimated time',price:'Agreed price',confirm:'Confirm',newTime:'Choose another time',cancel:'Cancel',ask:'What time would suit you better?',placeholder:'Write a preferred day and time',confirmed:'Thank you. Your booking is confirmed.',requested:'Your request was sent. SIR will contact you with another time.',cancelled:'The booking was cancelled.',bad:'This link is invalid or has expired.',status:'Status'},ru:{title:'Подтвердите предложение',lead:'Проверьте время, цену и место перед подтверждением.',service:'Услуга',when:'Время',place:'Место',duration:'Ориентировочно',price:'Согласованная цена',confirm:'Подтвердить',newTime:'Другое время',cancel:'Отменить',ask:'Какое время вам удобнее?',placeholder:'Напишите удобный день и время',confirmed:'Спасибо. Заказ подтверждён.',requested:'Запрос отправлен. SIR свяжется с вами и предложит другое время.',cancelled:'Заказ отменён.',bad:'Ссылка недействительна или срок её действия истёк.',status:'Статус'}};const $=id=>document.getElementById(id),tr=k=>txt[lang][k];document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>{lang=b.dataset.lang;document.documentElement.lang=lang;document.querySelectorAll('[data-lang]').forEach(x=>x.classList.toggle('active',x===b));renderText();if(offer)renderOffer();}));async function rpc(name,body){const r=await fetch(`${C.supabaseUrl}/rest/v1/rpc/${name}`,{method:'POST',headers:{'Content-Type':'application/json','apikey':C.supabasePublishableKey},body:JSON.stringify(body)});if(!r.ok)throw new Error(await r.text());return r.json();}function renderText(){$('title').textContent=tr('title');$('lead').textContent=tr('lead');$('confirmBtn').textContent=tr('confirm');$('newTimeBtn').textContent=tr('newTime');$('cancelBtn').textContent=tr('cancel');$('newTimeLabel').textContent=tr('ask');$('requested').placeholder=tr('placeholder');}function fmt(v){if(!v)return'—';return new Intl.DateTimeFormat(lang==='ru'?'ru-RU':lang==='en'?'en-GB':'nb-NO',{weekday:'short',day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'}).format(new Date(v));}function renderOffer(){const mins=+offer.estimated_minutes||0;$('details').innerHTML=`<div class="row"><span>${tr('service')}</span><b>${esc(offer.service_type||'—')}</b></div><div class="row"><span>${tr('when')}</span><b>${fmt(offer.starts_at)}</b></div><div class="row"><span>${tr('place')}</span><b>${esc(offer.address||offer.location_mode||'—')}</b></div><div class="row"><span>${tr('duration')}</span><b>${mins?Math.round(mins/30)/2+' h':'—'}</b></div><div class="row"><span>${tr('price')}</span><b class="price">${new Intl.NumberFormat('nb-NO').format(+offer.final_price||0)} NOK</b></div><div class="row"><span>${tr('status')}</span><b class="status">${esc(offer.status||'—')}</b></div>`;if(!['awaiting_confirmation','offer_sent'].includes(offer.status))$('responseBox').classList.add('hidden');}
async function load(){renderText();if(!orderNo||!token){fail();return;}try{offer=await rpc('public_get_offer',{p_order_no:orderNo,p_token:token});$('loading').classList.add('hidden');$('offer').classList.remove('hidden');renderOffer();}catch(_e){fail();}}function fail(){$('loading').className='card error';$('loading').textContent=tr('bad');}async function respond(action){let requested=null;if(action==='new_time'){const box=$('newTimeBox');if(box.classList.contains('hidden')){box.classList.remove('hidden');$('requested').focus();return;}requested=$('requested').value.trim();if(!requested)return;}try{const out=await rpc('public_respond_offer',{p_order_no:orderNo,p_token:token,p_action:action,p_requested:requested});offer.status=out.status;$('responseBox').classList.add('hidden');$('message').classList.remove('hidden');$('message').textContent=action==='confirm'?tr('confirmed'):action==='new_time'?tr('requested'):tr('cancelled');renderOffer();}catch(_e){$('message').className='notice error';$('message').textContent=tr('bad');$('message').classList.remove('hidden');}}$('confirmBtn').addEventListener('click',()=>respond('confirm'));$('newTimeBtn').addEventListener('click',()=>respond('new_time'));$('cancelBtn').addEventListener('click',()=>{if(confirm(tr('cancel')+'?'))respond('cancel');});function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}load();})();
</script></body></html>
