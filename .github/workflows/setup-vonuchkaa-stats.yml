name: Setup Vonuchkaa user stats

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/setup-vonuchkaa-stats.yml'

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Create stats storage
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          SQL=$(cat <<'SQL'
          create table if not exists public.vonuchkaa_user_stats (
            chat_id bigint not null,
            user_id bigint not null,
            first_name text,
            username text,
            message_count bigint not null default 0,
            warn_count integer not null default 0,
            ban_count integer not null default 0,
            last_message_at timestamptz,
            updated_at timestamptz not null default now(),
            primary key (chat_id, user_id)
          );

          create table if not exists public.vonuchkaa_moderation_events (
            id bigint generated by default as identity primary key,
            chat_id bigint not null,
            user_id bigint not null,
            action text not null,
            actor_user_id bigint,
            reason text,
            created_at timestamptz not null default now()
          );

          alter table public.vonuchkaa_user_stats enable row level security;
          alter table public.vonuchkaa_moderation_events enable row level security;

          create index if not exists vonuchkaa_user_stats_chat_messages_idx
            on public.vonuchkaa_user_stats (chat_id, message_count desc);
          create index if not exists vonuchkaa_moderation_events_user_idx
            on public.vonuchkaa_moderation_events (chat_id, user_id, created_at desc);

          create or replace function public.vonuchkaa_track_message(
            p_chat_id bigint,
            p_user_id bigint,
            p_first_name text,
            p_username text
          ) returns void
          language plpgsql
          security invoker
          set search_path = public
          as $$
          begin
            insert into public.vonuchkaa_user_stats as s
              (chat_id, user_id, first_name, username, message_count, last_message_at, updated_at)
            values
              (p_chat_id, p_user_id, p_first_name, p_username, 1, now(), now())
            on conflict (chat_id, user_id) do update set
              first_name = coalesce(excluded.first_name, s.first_name),
              username = coalesce(excluded.username, s.username),
              message_count = s.message_count + 1,
              last_message_at = now(),
              updated_at = now();
          end;
          $$;

          create or replace function public.vonuchkaa_track_moderation(
            p_chat_id bigint,
            p_user_id bigint,
            p_action text,
            p_actor_user_id bigint,
            p_reason text
          ) returns void
          language plpgsql
          security invoker
          set search_path = public
          as $$
          begin
            insert into public.vonuchkaa_moderation_events
              (chat_id, user_id, action, actor_user_id, reason)
            values
              (p_chat_id, p_user_id, left(p_action, 32), p_actor_user_id, left(p_reason, 800));

            insert into public.vonuchkaa_user_stats as s
              (chat_id, user_id, warn_count, ban_count, updated_at)
            values
              (p_chat_id, p_user_id,
               case when p_action = 'warn' then 1 else 0 end,
               case when p_action = 'ban' then 1 else 0 end,
               now())
            on conflict (chat_id, user_id) do update set
              warn_count = s.warn_count + excluded.warn_count,
              ban_count = s.ban_count + excluded.ban_count,
              updated_at = now();
          end;
          $$;

          revoke all on function public.vonuchkaa_track_message(bigint,bigint,text,text) from public;
          revoke all on function public.vonuchkaa_track_moderation(bigint,bigint,text,bigint,text) from public;
          grant execute on function public.vonuchkaa_track_message(bigint,bigint,text,text) to service_role;
          grant execute on function public.vonuchkaa_track_moderation(bigint,bigint,text,bigint,text) to service_role;
          SQL
          )
          PAYLOAD=$(jq -n --arg query "$SQL" '{query:$query}')
          curl --fail-with-body --silent --show-error \
            -X POST "https://api.supabase.com/v1/projects/wbqxposidtecxjioqufk/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
