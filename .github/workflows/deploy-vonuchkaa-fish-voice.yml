name: Deploy Vonuchkaa Fish Audio voice

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-vonuchkaa-fish-voice.yml'
      - '.github/patches/patch-vonuchkaa-fish-voices.py'
      - '.github/patches/patch-vonuchkaa-silence.py'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Ensure Vonuchkaa silence storage
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          SQL=$(cat <<'SQL'
          create table if not exists public.vonuchkaa_silence_chats (
            chat_id bigint primary key,
            enabled boolean not null default false,
            enabled_by bigint,
            updated_at timestamptz not null default now()
          );
          alter table public.vonuchkaa_silence_chats enable row level security;
          create index if not exists vonuchkaa_silence_enabled_idx
            on public.vonuchkaa_silence_chats (enabled, updated_at desc);
          SQL
          )
          PAYLOAD=$(jq -n --arg query "$SQL" '{query:$query}')
          curl --fail-with-body --silent --show-error \
            -X POST "https://api.supabase.com/v1/projects/wbqxposidtecxjioqufk/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"

      - name: Restore Vonuchkaa stable build inputs
        run: |
          git checkout 2ca022b117cb5a74d3b6bacb829b209f25676d9c -- supabase/functions/vonuchkaa-ai-bot .github/scripts

      - name: Apply Vonuchkaa patches
        run: |
          python3 .github/scripts/patch-vonuchkaa-nicknames.py
          python3 .github/scripts/patch-vonuchkaa-post.py
          python3 .github/scripts/patch-vonuchkaa-start-menu.py
          python3 .github/scripts/patch-vonuchkaa-autopromo.py
          python3 .github/scripts/patch-vonuchkaa-premium.py
          python3 .github/scripts/patch-vonuchkaa-premium-hotfix.py
          python3 .github/scripts/patch-vonuchkaa-owner-access.py
          python3 .github/scripts/patch-vonuchkaa-premium-v2.py
          python3 .github/scripts/patch-vonuchkaa-voice.py
          python3 .github/scripts/patch-vonuchkaa-voice-hotfix.py
          python3 .github/scripts/patch-vonuchkaa-all.py
          python3 .github/scripts/patch-vonuchkaa-zov.py
          python3 .github/scripts/patch-vonuchkaa-who.py

      - name: Add Fish Audio voice presets
        run: python3 .github/patches/patch-vonuchkaa-fish-voices.py

      - name: Add silence mode
        run: python3 .github/patches/patch-vonuchkaa-silence.py

      - name: Deploy vonuchkaa-ai-bot
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy vonuchkaa-ai-bot --project-ref wbqxposidtecxjioqufk --no-verify-jwt

      - name: Configure Telegram webhook
        run: |
          sleep 5
          RESPONSE=$(curl --silent --show-error "https://wbqxposidtecxjioqufk.supabase.co/functions/v1/vonuchkaa-ai-bot?setup=1")
          echo "$RESPONSE"
          echo "$RESPONSE" | grep -q '"ok":true'
