name: Compile BLESK Entry

on:
  push:
    branches:
      - blesk-compile-temp
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Pawn compiler and includes
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail https://github.com/pawn-lang/compiler/releases/download/v3.10.10/pawnc-3.10.10-linux.tar.gz -o pawnc.tar.gz
          mkdir -p pawnc
          tar -xzf pawnc.tar.gz -C pawnc
          git clone --depth 1 --branch v3.10.10 https://github.com/pawn-lang/compiler.git pawn-src
          git clone --depth 1 https://github.com/pawn-lang/samp-stdlib.git samp-stdlib

      - name: Compile blesk_entry.pwn
        shell: bash
        run: |
          set -euxo pipefail
          PAWNCC="$(find "$PWD/pawnc" -type f -name pawncc | head -n1)"
          LIBPAWNC="$(find "$PWD/pawnc" -type f -name 'libpawnc.so*' | head -n1)"
          chmod +x "$PAWNCC"
          export LD_LIBRARY_PATH="$(dirname "$LIBPAWNC"):${LD_LIBRARY_PATH:-}"
          "$PAWNCC" blesk_entry.pwn -i"$PWD/pawn-src/include" -i"$PWD/samp-stdlib" -oblesk_entry.amx
          test -s blesk_entry.amx
          file blesk_entry.amx
          ls -lah blesk_entry.amx

      - name: Save compiled AMX to temporary branch
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f blesk_entry.amx
          git commit -m "Compiled blesk_entry.amx [skip ci]"
          git push
