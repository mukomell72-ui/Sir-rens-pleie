name: Deploy Vonuchkaa moderation only

"on":
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-vonuchkaa-moderation-only.yml

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Download current deployed bot
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          rm -rf supabase/functions/vonuchkaa-ai-bot
          supabase functions download vonuchkaa-ai-bot --project-ref wbqxposidtecxjioqufk --use-api
          test -f supabase/functions/vonuchkaa-ai-bot/index.ts

      - name: Disable ordinary AI replies
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("supabase/functions/vonuchkaa-ai-bot/index.ts")
          s = p.read_text(encoding="utf-8")

          marker = "// VONUCHKAA_MODERATION_ONLY"
          if marker not in s:
              anchors = [
                  "  void typing(chatId, msg.message_thread_id ? Number(msg.message_thread_id) : undefined);",
                  "  await typing(chatId, msg.message_thread_id ? Number(msg.message_thread_id) : undefined);",
                  "  void typing(chatId,",
                  "  await typing(chatId,",
                  "  const author = String(msg?.from?.first_name",
                  "  const answer = await aiReply(",
              ]
              for anchor in anchors:
                  if anchor in s:
                      s = s.replace(
                          anchor,
                          "  // VONUCHKAA_MODERATION_ONLY\n  // Ordinary messages are ignored; command handlers above remain active.\n  return new Response(\"ok\");\n\n" + anchor,
                          1,
                      )
                      break
              else:
                  raise SystemExit("AI reply tail anchor not found")

          s = s.replace(
              "Ну давай, пиши что угодно. Отвечу по смыслу, без лишних церемоний. Для модерации: /modhelp",
              "Бот для управления группой. Команды модерации: /modhelp",
          )

          p.write_text(s, encoding="utf-8")
          print("Moderation-only mode applied")
          PY

      - name: Deploy bot
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy vonuchkaa-ai-bot --project-ref wbqxposidtecxjioqufk --no-verify-jwt --use-api

      - name: Configure Telegram webhook
        run: |
          sleep 5
          RESPONSE=$(curl --silent --show-error --max-time 30 "https://wbqxposidtecxjioqufk.supabase.co/functions/v1/vonuchkaa-ai-bot?setup=1" || true)
          echo "$RESPONSE"
          echo "$RESPONSE" | grep -q '"webhook":"Webhook was set"'
