name: Fix SIR Supabase Auth URLs

on:
  push:
    branches: [professional-redesign]
    paths:
      - '.github/workflows/fix-supabase-auth-url.yml'

permissions:
  contents: read

jobs:
  update-auth:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: fxdgeizhlhgvybclvmyo
      SITE_URL: https://mukomell72-ui.github.io/Sir-rens-pleie/
      URI_ALLOW_LIST: https://mukomell72-ui.github.io/Sir-rens-pleie/**,https://sir-rens.no/**,https://www.sir-rens.no/**
    steps:
      - name: Update Auth URL configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || { echo 'Missing SUPABASE_ACCESS_TOKEN'; exit 1; }
          BODY=$(node -e 'process.stdout.write(JSON.stringify({site_url:process.env.SITE_URL,uri_allow_list:process.env.URI_ALLOW_LIST}))')
          curl --fail-with-body --silent --show-error \
            -X PATCH "https://api.supabase.com/v1/projects/${PROJECT_REF}/config/auth" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data "$BODY" >/dev/null

      - name: Verify Auth URL configuration
        shell: bash
        run: |
          set -euo pipefail
          SAFE_CONFIG=$(curl --fail-with-body --silent --show-error \
            "https://api.supabase.com/v1/projects/${PROJECT_REF}/config/auth" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            | node -e '
              let s=""; process.stdin.on("data",d=>s+=d); process.stdin.on("end",()=>{
                const j=JSON.parse(s);
                const got={site_url:j.site_url,uri_allow_list:j.uri_allow_list};
                if(got.site_url!==process.env.SITE_URL || got.uri_allow_list!==process.env.URI_ALLOW_LIST){
                  console.error("Auth URL verification failed", got); process.exit(1);
                }
                process.stdout.write(JSON.stringify(got));
              });')
          echo "Verified: ${SAFE_CONFIG}"
