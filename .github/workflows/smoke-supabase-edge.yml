name: Smoke test SIR Supabase edge functions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/smoke-supabase-edge.yml'
      - 'supabase/functions/**'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Vehicle lookup validates request and rate limiter is reachable
        shell: bash
        run: |
          set -euo pipefail
          body_file="$(mktemp)"
          code="$(curl -sS -o "$body_file" -w '%{http_code}' \
            -X POST 'https://fxdgeizhlhgvybclvmyo.supabase.co/functions/v1/vehicle-lookup' \
            -H 'Origin: https://mukomell72-ui.github.io' \
            -H 'Content-Type: application/json' \
            --data '{"registrationNumber":"!"}')"
          test "$code" = "400"
          grep -q '"error":"invalid_plate"' "$body_file"

      - name: Postal distance validates requests
        shell: bash
        run: |
          set -euo pipefail
          body_file="$(mktemp)"
          code="$(curl -sS -o "$body_file" -w '%{http_code}' \
            -X POST 'https://fxdgeizhlhgvybclvmyo.supabase.co/functions/v1/postal-distance' \
            -H 'Origin: https://mukomell72-ui.github.io' \
            -H 'Content-Type: application/json' \
            --data '{"postalCode":"!"}')"
          test "$code" = "400"
          grep -q '"error":"invalid_postal_code"' "$body_file"

      - name: Photo upload rejects incomplete requests safely
        shell: bash
        run: |
          set -euo pipefail
          body_file="$(mktemp)"
          code="$(curl -sS -o "$body_file" -w '%{http_code}' \
            -X POST 'https://fxdgeizhlhgvybclvmyo.supabase.co/functions/v1/order-photo-upload' \
            -H 'Origin: https://mukomell72-ui.github.io' \
            -F 'order_no=bad')"
          test "$code" = "400"
          grep -q '"error":"invalid_request"' "$body_file"

      - name: CORS preflight works for intended production origins
        shell: bash
        run: |
          set -euo pipefail
          for endpoint in vehicle-lookup postal-distance
          do
            for origin in \
              'https://mukomell72-ui.github.io' \
              'https://sir-rens.no' \
              'https://www.sir-rens.no'
            do
              headers="$(mktemp)"
              curl -sS -D "$headers" -o /dev/null -X OPTIONS \
                "https://fxdgeizhlhgvybclvmyo.supabase.co/functions/v1/$endpoint" \
                -H "Origin: $origin" \
                -H 'Access-Control-Request-Method: POST'
              grep -qi "^access-control-allow-origin: $origin" "$headers"
            done
          done

      - name: Postal distance rejects foreign browser origins
        shell: bash
        run: |
          set -euo pipefail
          body_file="$(mktemp)"
          code="$(curl -sS -o "$body_file" -w '%{http_code}' \
            -X POST 'https://fxdgeizhlhgvybclvmyo.supabase.co/functions/v1/postal-distance' \
            -H 'Origin: https://example.invalid' \
            -H 'Content-Type: application/json' \
            --data '{"postalCode":"3616"}')"
          test "$code" = "403"
          grep -q '"error":"origin_not_allowed"' "$body_file"
