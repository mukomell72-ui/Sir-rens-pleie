name: Smoke test SIR Supabase edge functions

on:
  workflow_dispatch:
  push:
    branches: [professional-redesign]
    paths:
      - '.github/workflows/smoke-supabase-edge.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Vehicle lookup validates request and rate limiter is reachable
        shell: bash
        run: |
          set -euo pipefail
          body_file="$(mktemp)"
          code="$(curl -sS -o "$body_file" -w '%{http_code}' \
            -X POST 'https://fxdgeizhlhgvybclvmyo.supabase.co/functions/v1/vehicle-lookup' \
            -H 'Origin: https://mukomell72-ui.github.io' \
            -H 'Content-Type: application/json' \
            --data '{"registrationNumber":"!"}')"
          test "$code" = "400"
          grep -q '"error":"invalid_plate"' "$body_file"

      - name: Photo upload rejects incomplete requests safely
        shell: bash
        run: |
          set -euo pipefail
          body_file="$(mktemp)"
          code="$(curl -sS -o "$body_file" -w '%{http_code}' \
            -X POST 'https://fxdgeizhlhgvybclvmyo.supabase.co/functions/v1/order-photo-upload' \
            -H 'Origin: https://mukomell72-ui.github.io' \
            -F 'order_no=bad')"
          test "$code" = "400"
          grep -q '"error":"invalid_request"' "$body_file"

      - name: CORS preflight works for GitHub Pages and intended custom domains
        shell: bash
        run: |
          set -euo pipefail
          for origin in \
            'https://mukomell72-ui.github.io' \
            'https://sir-rens.no' \
            'https://www.sir-rens.no'
          do
            headers="$(mktemp)"
            curl -sS -D "$headers" -o /dev/null -X OPTIONS \
              'https://fxdgeizhlhgvybclvmyo.supabase.co/functions/v1/vehicle-lookup' \
              -H "Origin: $origin" \
              -H 'Access-Control-Request-Method: POST'
            grep -qi "^access-control-allow-origin: $origin" "$headers"
          done
