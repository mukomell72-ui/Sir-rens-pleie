name: Validate SIR production

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Static HTML and reference checks
        run: python3 scripts/validate_static.py
      - name: JavaScript syntax checks
        shell: bash
        run: |
          set -euo pipefail
          find assets admin guide-app tests scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done
      - name: Professional Guide data validation
        run: node scripts/validate_guide.mjs
      - name: Safety and repository isolation checks
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n 'rskgbkgtrigtznnksbyp' assets admin guide-app supabase scripts index.html privacy.html order q 2>/dev/null; then
            echo 'Old Supabase project reference found in runtime/migration files'
            exit 1
          fi
          if grep -R -n "PIN.*1234\|pin.*1234" assets admin guide-app supabase scripts index.html privacy.html order q 2>/dev/null; then
            echo 'Shared legacy admin PIN found in production files'
            exit 1
          fi
          foreign_regex='vonu[c]hkaa|bl[e]sk|username[-_]scanner'
          printf '%s\n' "deploy-vonu""chkaa-test.yml" "bl""esk-test.txt" "username""-scanner-test" | grep -Eq "$foreign_regex" || { echo 'Foreign-project regex self-test failed'; exit 1; }
          foreign_paths="$(git ls-files | grep -Ei "$foreign_regex" || true)"
          if [ -n "$foreign_paths" ]; then
            echo 'Unrelated project artifacts found anywhere in SIR main:'
            printf '%s\n' "$foreign_paths"
            exit 1
          fi
          foreign_refs="$(git grep -nEi "$foreign_regex|wbqxposidtecxjioquf[k]" -- . || true)"
          if [ -n "$foreign_refs" ]; then
            echo 'Unrelated project references found anywhere in tracked SIR files:'
            printf '%s\n' "$foreign_refs"
            exit 1
          fi
          if grep -R -n 'professional-redesign' .github/workflows --exclude='validate-professional.yml' 2>/dev/null; then
            echo 'Legacy deployment branch still referenced by a production workflow'
            exit 1
          fi
          test -f guide-app/index-v13.html
          test -f guide-app/app-v13.js
          test ! -f guide-app/index-v12.html
          test ! -f manifest.json
          echo 'Safety and repository isolation checks OK'

  browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start local site
        shell: bash
        run: |
          python3 -m http.server 4173 > /tmp/sir-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/sir-http.log
          exit 1
      - name: Run SIR Guide professional/HMS/offline regression
        shell: bash
        run: |
          set -euo pipefail
          timeout 90s node tests/guide-professional.mjs
      - name: Run SIR Guide resilience/error-protection regression
        shell: bash
        run: |
          set -euo pipefail
          timeout 90s node tests/guide-resilience.mjs
      - name: Run final mobile browser regression
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s node tests/client-e2e-final.mjs
      - name: Run individual elements regression
        shell: bash
        run: |
          set -euo pipefail
          timeout 60s node tests/elements-ui-regression.mjs
      - name: Run SIR signature profile regression
        shell: bash
        run: |
          set -euo pipefail
          timeout 60s node tests/signature-profile.mjs
      - name: Run exact poster navigation regression
        shell: bash
        run: |
          set -euo pipefail
          timeout 60s node tests/poster-navigation.mjs
      - name: Run public order live-status regression
        shell: bash
        run: |
          set -euo pipefail
          timeout 45s node tests/status-sync.mjs
      - name: Run admin mobile workspace regression
        shell: bash
        run: |
          set -euo pipefail
          timeout 60s node tests/admin-workspace.mjs
