name: Deploy Vonuchkaa owner access

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-vonuchkaa-owner-access.yml'
      - '.github/scripts/patch-vonuchkaa-owner-access.py'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Register owner from valid private claim attempt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          SQL=$(cat <<'SQL'
          with recent as (
            select chat_id,
                   trim(regexp_replace(content, '^.*?:[[:space:]]*', '')) as raw
            from public.vonuchkaa_chat_memory
            where role = 'user'
              and chat_id > 0
              and lower(content) like '%ownerclaim%'
            order by created_at desc
            limit 30
          ), valid as (
            select chat_id
            from recent
            where lower(raw) ~ '^ownerclaim[[:space:]]+'
              and md5(trim(regexp_replace(raw, '^ownerclaim[[:space:]]+', '', 'i'))) = 'a3a6dfc6e9734e92b1658edd57f1da5b'
            limit 1
          )
          insert into public.vonuchkaa_bot_owner (id, owner_user_id)
          select 1, chat_id from valid
          on conflict (id) do nothing;
          SQL
          )
          PAYLOAD=$(jq -n --arg query "$SQL" '{query:$query}')
          curl --fail-with-body --silent --show-error \
            -X POST "https://api.supabase.com/v1/projects/wbqxposidtecxjioqufk/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" >/dev/null

      - name: Apply all Vonuchkaa patches
        run: |
          python3 .github/scripts/patch-vonuchkaa-nicknames.py
          python3 .github/scripts/patch-vonuchkaa-post.py
          python3 .github/scripts/patch-vonuchkaa-start-menu.py
          python3 .github/scripts/patch-vonuchkaa-autopromo.py
          python3 .github/scripts/patch-vonuchkaa-premium.py
          python3 .github/scripts/patch-vonuchkaa-premium-hotfix.py
          python3 .github/scripts/patch-vonuchkaa-owner-access.py

      - name: Deploy vonuchkaa-ai-bot
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy vonuchkaa-ai-bot --project-ref wbqxposidtecxjioqufk --no-verify-jwt

      - name: Configure Telegram webhook
        run: |
          sleep 5
          RESPONSE=$(curl --silent --show-error "https://wbqxposidtecxjioqufk.supabase.co/functions/v1/vonuchkaa-ai-bot?setup=1")
          echo "$RESPONSE"
          echo "$RESPONSE" | grep -q '"ok":true'
