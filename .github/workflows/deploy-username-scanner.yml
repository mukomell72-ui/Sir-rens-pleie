name: Deploy username scanner bot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/username-scanner-bot/**'
      - '.github/workflows/deploy-username-scanner.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy username-scanner-bot
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy username-scanner-bot --project-ref wbqxposidtecxjioqufk --no-verify-jwt

      - name: Configure Telegram webhook
        run: |
          sleep 5
          curl --fail --silent --show-error "https://wbqxposidtecxjioqufk.supabase.co/functions/v1/username-scanner-bot?setup=1"
