name: Build Pawn Linux x64

on:
  push:
    branches:
      - blesk-compile-temp
    paths:
      - '.github/workflows/get-pawnc-linux-x64.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Build compiler from source
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/pawn-lang/compiler.git pawn-compiler
          mkdir build
          cd build
          cmake ../pawn-compiler/source/compiler -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DCMAKE_C_FLAGS='-Wno-address-of-packed-member'
          cmake --build . --target pawncc -j2
          mkdir -p ../out/bin ../out/lib
          cp ./pawncc ../out/bin/pawncc
          cp ./libpawnc.so ../out/lib/libpawnc.so
          chmod +x ../out/bin/pawncc
          file ../out/bin/pawncc
      - name: Upload x64 compiler
        uses: actions/upload-artifact@v4
        with:
          name: pawnc-linux-x64
          path: out
          if-no-files-found: error
