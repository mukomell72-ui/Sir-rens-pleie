name: Deploy Supabase vehicle lookup

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/vehicle-lookup/**'
      - 'supabase/config.toml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy vehicle-lookup
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy vehicle-lookup --project-ref rskgbkqtrigtznnksbyp --no-verify-jwt
