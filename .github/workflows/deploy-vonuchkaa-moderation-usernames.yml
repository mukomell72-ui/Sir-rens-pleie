name: Deploy Vonuchkaa moderation usernames

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-vonuchkaa-moderation-usernames.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Restore Vonuchkaa build inputs
        run: |
          git checkout 2ca022b117cb5a74d3b6bacb829b209f25676d9c -- supabase/functions/vonuchkaa-ai-bot .github/scripts
          git checkout 2acc0b3582219d218292cb756f26443ed8e38c00 -- .github/patches/patch-vonuchkaa-fish-voices.py .github/patches/patch-vonuchkaa-silence.py
          git checkout 979ecbb7b10db97758ad9d5cbf2168f78135bc27 -- .github/patches/patch-vonuchkaa-savage-slow.py

      - name: Apply existing Vonuchkaa patches
        run: |
          python3 .github/scripts/patch-vonuchkaa-nicknames.py
          python3 .github/scripts/patch-vonuchkaa-post.py
          python3 .github/scripts/patch-vonuchkaa-start-menu.py
          python3 .github/scripts/patch-vonuchkaa-autopromo.py
          python3 .github/scripts/patch-vonuchkaa-premium.py
          python3 .github/scripts/patch-vonuchkaa-premium-hotfix.py
          python3 .github/scripts/patch-vonuchkaa-owner-access.py
          python3 .github/scripts/patch-vonuchkaa-premium-v2.py
          python3 .github/scripts/patch-vonuchkaa-voice.py
          python3 .github/scripts/patch-vonuchkaa-voice-hotfix.py
          python3 .github/scripts/patch-vonuchkaa-all.py
          python3 .github/scripts/patch-vonuchkaa-zov.py
          python3 .github/scripts/patch-vonuchkaa-who.py
          python3 .github/patches/patch-vonuchkaa-fish-voices.py
          python3 .github/patches/patch-vonuchkaa-silence.py
          python3 .github/patches/patch-vonuchkaa-savage-slow.py

      - name: Restore /сбор command
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('supabase/functions/vonuchkaa-ai-bot/index.ts')
          s = p.read_text(encoding='utf-8')
          helper = r'''
          async function handleSborCommand(msg: any, text: string) {
            if (!/^\/сбор(?:@\w+)?(?:\s|$)/iu.test(text)) return false;
            if (!["group", "supergroup"].includes(String(msg?.chat?.type ?? ""))) { await reply(msg, "/сбор работает только в группе."); return true; }
            const chatId = Number(msg.chat.id), userId = Number(msg?.from?.id);
            if (await effectiveLevel(chatId, userId) < 5) { await reply(msg, "/сбор доступен только администратору группы или модератору 5 уровня."); return true; }
            const announcement = text.replace(/^\/сбор(?:@\w+)?(?:\s+|$)/iu, "").trim();
            if (!announcement) { await reply(msg, "Формат: /сбор ваше сообщение"); return true; }
            await rememberAllAdmins(chatId);
            const rows = await knownAllMembers(chatId), unique = new Map<number, VonAllMember>();
            for (const row of rows) { const id = Number(row?.user_id); if (id && !row?.is_bot && id !== userId) unique.set(id, row); }
            const members = [...unique.values()];
            if (!members.length) { await reply(msg, "Пока не знаю участников этой группы. Бот запоминает их по сообщениям и входам в группу."); return true; }
            await sendAllMentionBatches(msg, announcement, members);
            return true;
          }
          '''
          anchor = '\nDeno.serve(async (req: Request) => {'
          if 'async function handleSborCommand' not in s:
              if anchor not in s: raise SystemExit('serve anchor not found')
              s = s.replace(anchor, '\n' + helper + anchor, 1)
          if 'await handleSborCommand(msg, text)' not in s:
              for a in ['  if (await handleWhoCommand(msg, text)) return new Response("ok");','  if (await handleZovCommand(msg, text)) return new Response("ok");','  if (await handleAllMention(msg, text)) return new Response("ok");']:
                  if a in s:
                      s = s.replace(a, '  if (await handleSborCommand(msg, text)) return new Response("ok");\n' + a, 1)
                      break
              else: raise SystemExit('sbor route anchor not found')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Add username targets to moderation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('supabase/functions/vonuchkaa-ai-bot/index.ts')
          s = p.read_text(encoding='utf-8')

          helper = r'''
          type KnownModerationUser = { user_id: number; username?: string | null; first_name?: string | null };

          async function findKnownModerationUser(chatId: number, raw: string): Promise<KnownModerationUser | null> {
            const token = String(raw ?? "").trim().replace(/^@/, "");
            if (/^\d{5,20}$/.test(token)) return { user_id: Number(token) };
            if (!/^[A-Za-z0-9_]{3,64}$/.test(token) || !SUPABASE_URL || !SERVICE_KEY) return null;
            for (const table of ["vonuchkaa_chat_members", "vonuchkaa_user_stats"]) {
              try {
                const q = new URL(`${SUPABASE_URL}/rest/v1/${table}`);
                q.searchParams.set("select", "user_id,username,first_name");
                q.searchParams.set("chat_id", `eq.${chatId}`);
                q.searchParams.set("username", `ilike.${token}`);
                q.searchParams.set("limit", "1");
                const r = await fetch(q, { headers: dbHeaders(), signal: AbortSignal.timeout(1500) });
                if (!r.ok) continue;
                const rows = await r.json();
                if (Array.isArray(rows) && rows[0]?.user_id) return rows[0] as KnownModerationUser;
              } catch {}
            }
            try {
              const q = new URL(`${SUPABASE_URL}/rest/v1/vonuchkaa_nicknames`);
              q.searchParams.set("select", "user_id,telegram_label,nickname");
              q.searchParams.set("chat_id", `eq.${chatId}`);
              q.searchParams.set("telegram_label", `ilike.%${token}%`);
              q.searchParams.set("limit", "1");
              const r = await fetch(q, { headers: dbHeaders(), signal: AbortSignal.timeout(1500) });
              if (r.ok) {
                const rows = await r.json();
                if (Array.isArray(rows) && rows[0]?.user_id) return { user_id: Number(rows[0].user_id), username: token, first_name: rows[0].nickname ?? null };
              }
            } catch {}
            return null;
          }

          function moderationKnownLabel(found: KnownModerationUser) {
            return found.username ? `@${found.username}` : (found.first_name || `ID ${found.user_id}`);
          }

          async function handleModerationByUsername(msg: any, text: string) {
            const m = String(text ?? "").match(/^\/?(ban|unban|kick|mute|unmute|warn)(?:@\w+)?\s+(@?[A-Za-z0-9_]{3,64}|\d{5,20})(?:\s+(.*))?$/i);
            if (!m) return false;
            const clean = String(m[1]).toLowerCase();
            if (!["group", "supergroup"].includes(String(msg?.chat?.type ?? ""))) { await reply(msg, `/${clean} работает только в группе.`); return true; }

            const chatId = Number(msg.chat.id), issuerId = Number(msg?.from?.id);
            const level = await effectiveLevel(chatId, issuerId);
            const need = REQUIRED_LEVEL[clean] ?? 5;
            if (level < need) { await reply(msg, `Недостаточно прав. Для /${clean} нужен уровень ${need}, у тебя ${level}.`); return true; }

            const found = await findKnownModerationUser(chatId, m[2]);
            if (!found?.user_id) {
              await reply(msg, `Не нашёл ${m[2]} в сохранённом реестре. Если бот ещё не видел этого пользователя, один раз нужен Telegram ID.`);
              return true;
            }

            const targetId = Number(found.user_id);
            const name = moderationKnownLabel(found);
            if (targetId === issuerId && ["ban", "kick", "mute"].includes(clean)) {
              await reply(msg, "Самого себя наказывать не дам. Хорошая попытка.");
              return true;
            }
            if (["ban", "kick", "mute"].includes(clean) && await targetIsAdmin(chatId, targetId)) {
              await reply(msg, "Админа или владельца группы так наказать не получится.");
              return true;
            }

            const tail = String(m[3] ?? "").trim();
            if (clean === "ban") {
              const reason = tail;
              const r = await tg("banChatMember", { chat_id: chatId, user_id: targetId, revoke_messages: false });
              if (r?.ok) void trackModerationEvent(chatId, targetId, "ban", issuerId, reason);
              await reply(msg, r?.ok ? `Забанил ${name}.${reason ? ` Причина: ${reason}` : ""}` : `Не смог забанить ${name}: ${tgError(r)}. Проверь права бота.`);
              return true;
            }
            if (clean === "unban") {
              const r = await tg("unbanChatMember", { chat_id: chatId, user_id: targetId, only_if_banned: true });
              await reply(msg, r?.ok ? `Разбанил ${name}.` : `Не смог разбанить ${name}: ${tgError(r)}.`);
              return true;
            }
            if (clean === "kick") {
              const reason = tail;
              const ban = await tg("banChatMember", { chat_id: chatId, user_id: targetId, revoke_messages: false });
              if (!ban?.ok) { await reply(msg, `Не смог кикнуть ${name}: ${tgError(ban)}. Проверь права бота.`); return true; }
              const unban = await tg("unbanChatMember", { chat_id: chatId, user_id: targetId, only_if_banned: true });
              await reply(msg, unban?.ok ? `Кикнул ${name}.${reason ? ` Причина: ${reason}` : ""}` : `Удалил ${name}, но не смог сразу снять бан: ${tgError(unban)}.`);
              return true;
            }
            if (clean === "mute") {
              const parts = tail ? tail.split(/\s+/) : [];
              const duration = parseDuration(parts[0]);
              const reason = parts.slice(duration.consumed ? 1 : 0).join(" ").trim();
              const body: Record<string, unknown> = {
                chat_id: chatId,
                user_id: targetId,
                permissions: {
                  can_send_messages: false,
                  can_send_audios: false,
                  can_send_documents: false,
                  can_send_photos: false,
                  can_send_videos: false,
                  can_send_video_notes: false,
                  can_send_voice_notes: false,
                  can_send_polls: false,
                  can_send_other_messages: false,
                  can_add_web_page_previews: false,
                  can_change_info: false,
                  can_invite_users: false,
                  can_pin_messages: false,
                  can_manage_topics: false,
                },
                use_independent_chat_permissions: true,
              };
              if (duration.seconds !== null) body.until_date = Math.floor(Date.now() / 1000) + duration.seconds;
              const r = await tg("restrictChatMember", body);
              await reply(msg, r?.ok ? `Замутил ${name} на ${duration.label}.${reason ? ` Причина: ${reason}` : ""}` : `Не смог замутить ${name}: ${tgError(r)}. Проверь права бота.`);
              return true;
            }
            if (clean === "unmute") {
              const chat = await tg("getChat", { chat_id: chatId });
              const permissions = chat?.result?.permissions ?? {
                can_send_messages: true,
                can_send_audios: true,
                can_send_documents: true,
                can_send_photos: true,
                can_send_videos: true,
                can_send_video_notes: true,
                can_send_voice_notes: true,
                can_send_polls: true,
                can_send_other_messages: true,
                can_add_web_page_previews: true,
              };
              const r = await tg("restrictChatMember", { chat_id: chatId, user_id: targetId, permissions, use_independent_chat_permissions: true });
              await reply(msg, r?.ok ? `Снял мут с ${name}.` : `Не смог снять мут с ${name}: ${tgError(r)}.`);
              return true;
            }
            if (clean === "warn") {
              const reason = tail;
              void trackModerationEvent(chatId, targetId, "warn", issuerId, reason);
              await reply(msg, `Предупреждение для ${name}.${reason ? ` Причина: ${reason}` : " Следующее нарушение может закончиться мутом или баном."}`);
              return true;
            }
            return true;
          }

          async function rememberModerationChatMemberUpdate(update: any) {
            const cm = update?.chat_member;
            const chatId = Number(cm?.chat?.id);
            const user = cm?.new_chat_member?.user;
            if (!chatId || !user?.id) return false;
            const status = String(cm?.new_chat_member?.status ?? "");
            const active = !["left", "kicked"].includes(status);
            await rememberAllMember(chatId, user, active);
            return true;
          }
          '''

          anchor = '\nDeno.serve(async (req: Request) => {'
          if 'async function handleModerationByUsername' not in s:
              if anchor not in s: raise SystemExit('serve anchor not found')
              s = s.replace(anchor, '\n' + helper + anchor, 1)

          route = '  if (await handleModeration(msg, resolvedText)) return new Response("ok");'
          username_route = '  if (await handleModerationByUsername(msg, resolvedText)) return new Response("ok");'
          if username_route not in s:
              if route not in s: raise SystemExit('moderation route anchor not found')
              s = s.replace(route, username_route + '\n' + route, 1)

          update_anchor = '  const update = await req.json().catch(() => null);'
          member_route = '  if (await rememberModerationChatMemberUpdate(update)) return new Response("ok");'
          if member_route not in s:
              if update_anchor not in s: raise SystemExit('update anchor not found')
              s = s.replace(update_anchor, update_anchor + '\n' + member_route, 1)

          pat = re.compile(r'allowed_updates:\s*\[([^\]]*)\]')
          mm = pat.search(s)
          if not mm: raise SystemExit('allowed_updates anchor not found')
          vals = [x.strip() for x in mm.group(1).split(',') if x.strip()]
          existing = {v.strip('"\'') for v in vals}
          for want in ['message','callback_query','chat_member','my_chat_member']:
              if want not in existing: vals.append(f'"{want}"')
          s = pat.sub('allowed_updates: [' + ', '.join(vals) + ']', s, count=1)

          old_help = '      "Наказания используй ответом на сообщение человека."'
          new_help = '      "Можно ответом на сообщение или по @username: /mute @user 10m, /ban @user, /unban @user."'
          if old_help in s:
              s = s.replace(old_help, new_help, 1)

          p.write_text(s, encoding='utf-8')
          print('Vonuchkaa username moderation applied')
          PY

      - name: Deploy vonuchkaa-ai-bot
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy vonuchkaa-ai-bot --project-ref wbqxposidtecxjioqufk --no-verify-jwt

      - name: Configure Telegram webhook
        run: |
          sleep 5
          RESPONSE=$(curl --silent --show-error --max-time 30 "https://wbqxposidtecxjioqufk.supabase.co/functions/v1/vonuchkaa-ai-bot?setup=1" || true)
          echo "$RESPONSE"
          echo "$RESPONSE" | grep -q '"webhook":"Webhook was set"'
