name: Temporary BLESK Pawn Build

on:
  push:
    branches:
      - blesk-build-temp-20260909

jobs:
  compile:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download native Linux x64 Pawn compiler
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .pawncc
          curl -fsSL https://raw.githubusercontent.com/Mac-Andreas/vscode-open-pawn/main/bin/linux-x64/pawncc -o .pawncc/pawncc
          curl -fsSL https://raw.githubusercontent.com/Mac-Andreas/vscode-open-pawn/main/bin/linux-x64/libpawnc.so -o .pawncc/libpawnc.so
          chmod +x .pawncc/pawncc
          file .pawncc/pawncc .pawncc/libpawnc.so

      - name: Compile BLESK_RUSSIA.pwn
        shell: bash
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$PWD/.pawncc:${LD_LIBRARY_PATH:-}"
          ./.pawncc/pawncc tools/blesk-build/BLESK_RUSSIA.pwn \
            -otools/blesk-build/BLESK_RUSSIA.amx \
            -Z -d3

      - name: Verify AMX header
        shell: bash
        run: |
          set -euo pipefail
          test -s tools/blesk-build/BLESK_RUSSIA.amx
          SIZE=$(stat -c%s tools/blesk-build/BLESK_RUSSIA.amx)
          MAGIC=$(xxd -s 4 -l 2 -p tools/blesk-build/BLESK_RUSSIA.amx)
          echo "AMX size: ${SIZE} bytes"
          echo "AMX magic bytes at offset 4: ${MAGIC}"
          test "$MAGIC" = "e0f1"

      - name: Upload compiled gamemode
        uses: actions/upload-artifact@v4
        with:
          name: BLESK_RUSSIA_BASE_V0_1_AMX
          path: tools/blesk-build/BLESK_RUSSIA.amx
          if-no-files-found: error
