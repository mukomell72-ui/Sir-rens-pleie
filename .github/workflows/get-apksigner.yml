name: Get ApkSigner

on:
  push:
    branches:
      - blesk-compile-temp
  workflow_dispatch:

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - name: Find Android build tools
        shell: bash
        run: |
          set -euxo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n1)"
          BT="$(dirname "$APKSIGNER")"
          mkdir -p out/lib
          cp "$APKSIGNER" out/apksigner
          cp "$ZIPALIGN" out/zipalign
          cp "$BT/lib/apksigner.jar" out/lib/apksigner.jar
          chmod +x out/apksigner out/zipalign
          ls -lah out out/lib
      - name: Upload tools
        uses: actions/upload-artifact@v4
        with:
          name: android-sign-tools
          path: out
          retention-days: 1
