name: Deploy Vonuchkaa AI bot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/vonuchkaa-ai-bot/**'
      - '.github/workflows/deploy-vonuchkaa-ai-bot.yml'
      - '.github/scripts/patch-vonuchkaa-nicknames.py'
      - '.github/scripts/patch-vonuchkaa-post.py'
      - '.github/scripts/patch-vonuchkaa-start-menu.py'
      - '.github/scripts/patch-vonuchkaa-autopromo.py'
      - '.github/scripts/patch-vonuchkaa-premium.py'
      - '.github/scripts/patch-vonuchkaa-premium-hotfix.py'
      - '.github/scripts/patch-vonuchkaa-owner-access.py'
      - '.github/scripts/patch-vonuchkaa-premium-v2.py'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Ensure Vonuchkaa storage
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          SQL=$(cat <<'SQL'
          create table if not exists public.vonuchkaa_moderators (
            chat_id bigint not null,
            user_id bigint not null,
            level smallint not null check (level between 1 and 5),
            set_by bigint,
            updated_at timestamptz not null default now(),
            primary key (chat_id, user_id)
          );

          create table if not exists public.vonuchkaa_command_aliases (
            chat_id bigint not null,
            user_id bigint not null,
            base_command text not null,
            alias text not null,
            updated_at timestamptz not null default now(),
            primary key (chat_id, user_id,base_command),
            unique (chat_id, user_id, alias),
            check (alias ~ '^[a-zA-Zа-яА-ЯёЁ0-9_]{1,32}$')
          );

          alter table public.vonuchkaa_command_aliases
            drop constraint if exists vonuchkaa_command_aliases_base_command_check;
          alter table public.vonuchkaa_command_aliases
            add constraint vonuchkaa_command_aliases_base_command_check
            check (base_command in ('ban','unban','kick','mute','unmute','warn','del','pin','unpin','modhelp','snick','dnick','ники'));

          create table if not exists public.vonuchkaa_nicknames (
            chat_id bigint not null,
            user_id bigint not null,
            nickname text not null check (char_length(nickname) between 1 and 64),
            telegram_label text,
            set_by bigint,
            updated_at timestamptz not null default now(),
            primary key (chat_id, user_id)
          );

          create table if not exists public.vonuchkaa_autopromo_chats (
            chat_id bigint primary key,
            enabled boolean not null default false,
            enabled_by bigint,
            interval_hours integer not null default 72 check (interval_hours between 24 and 168),
            last_post_at timestamptz,
            updated_at timestamptz not null default now()
          );

          create table if not exists public.vonuchkaa_premium_chats (
            chat_id bigint primary key,
            active_until timestamptz not null,
            payer_user_id bigint not null,
            telegram_charge_id text,
            recurring boolean not null default true,
            updated_at timestamptz not null default now()
          );

          create table if not exists public.vonuchkaa_premium_settings (
            chat_id bigint primary key,
            persona text,
            welcome_enabled boolean not null default false,
            welcome_text text,
            goodbye_enabled boolean not null default false,
            goodbye_text text,
            rules_text text,
            ai_mode text not null default 'all',
            links_block boolean not null default false,
            caps_block boolean not null default false,
            badwords_enabled boolean not null default false,
            updated_at timestamptz not null default now()
          );

          alter table public.vonuchkaa_premium_settings add column if not exists goodbye_enabled boolean not null default false;
          alter table public.vonuchkaa_premium_settings add column if not exists goodbye_text text;
          alter table public.vonuchkaa_premium_settings add column if not exists rules_text text;
          alter table public.vonuchkaa_premium_settings add column if not exists ai_mode text not null default 'all';
          alter table public.vonuchkaa_premium_settings add column if not exists links_block boolean not null default false;
          alter table public.vonuchkaa_premium_settings add column if not exists caps_block boolean not null default false;
          alter table public.vonuchkaa_premium_settings add column if not exists badwords_enabled boolean not null default false;
          alter table public.vonuchkaa_premium_settings drop constraint if exists vonuchkaa_premium_settings_ai_mode_check;
          alter table public.vonuchkaa_premium_settings add constraint vonuchkaa_premium_settings_ai_mode_check check (ai_mode in ('all','mention','reply','off'));

          create table if not exists public.vonuchkaa_premium_badwords (
            chat_id bigint not null,
            word text not null,
            added_by bigint,
            created_at timestamptz not null default now(),
            primary key (chat_id, word),
            check (char_length(word) between 2 and 64)
          );

          create table if not exists public.vonuchkaa_premium_autoreplies (
            id bigint generated by default as identity primary key,
            chat_id bigint not null,
            trigger_text text not null,
            response_text text not null,
            added_by bigint,
            created_at timestamptz not null default now(),
            unique (chat_id, trigger_text),
            check (char_length(trigger_text) between 2 and 80),
            check (char_length(response_text) between 1 and 1500)
          );

          create table if not exists public.vonuchkaa_premium_payments (
            id bigint generated by default as identity primary key,
            chat_id bigint not null,
            user_id bigint not null,
            telegram_charge_id text not null unique,
            stars integer not null,
            expiration_date timestamptz,
            is_recurring boolean not null default false,
            is_first_recurring boolean not null default false,
            paid_at timestamptz not null default now()
          );

          create table if not exists public.vonuchkaa_bot_owner (
            id smallint primary key check (id = 1),
            owner_user_id bigint not null unique,
            claimed_at timestamptz not null default now()
          );

          alter table public.vonuchkaa_moderators enable row level security;
          alter table public.vonuchkaa_command_aliases enable row level security;
          alter table public.vonuchkaa_nicknames enable row level security;
          alter table public.vonuchkaa_autopromo_chats enable row level security;
          alter table public.vonuchkaa_premium_chats enable row level security;
          alter table public.vonuchkaa_premium_settings enable row level security;
          alter table public.vonuchkaa_premium_badwords enable row level security;
          alter table public.vonuchkaa_premium_autoreplies enable row level security;
          alter table public.vonuchkaa_premium_payments enable row level security;
          alter table public.vonuchkaa_bot_owner enable row level security;

          create index if not exists vonuchkaa_moderators_chat_level_idx on public.vonuchkaa_moderators (chat_id, level desc);
          create index if not exists vonuchkaa_command_aliases_lookup_idx on public.vonuchkaa_command_aliases (chat_id, user_id, alias);
          create index if not exists vonuchkaa_nicknames_chat_idx on public.vonuchkaa_nicknames (chat_id, updated_at desc);
          create index if not exists vonuchkaa_autopromo_enabled_idx on public.vonuchkaa_autopromo_chats (enabled, last_post_at);
          create index if not exists vonuchkaa_premium_active_idx on public.vonuchkaa_premium_chats (active_until desc);
          create index if not exists vonuchkaa_premium_badwords_chat_idx on public.vonuchkaa_premium_badwords (chat_id);
          create index if not exists vonuchkaa_premium_autoreplies_chat_idx on public.vonuchkaa_premium_autoreplies (chat_id);
          create index if not exists vonuchkaa_premium_payments_chat_idx on public.vonuchkaa_premium_payments (chat_id, paid_at desc);
          SQL
          )
          PAYLOAD=$(jq -n --arg query "$SQL" '{query:$query}')
          curl --fail-with-body --silent --show-error \
            -X POST "https://api.supabase.com/v1/projects/wbqxposidtecxjioqufk/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"

      - name: Apply Vonuchkaa patches
        run: |
          python3 .github/scripts/patch-vonuchkaa-nicknames.py
          python3 .github/scripts/patch-vonuchkaa-post.py
          python3 .github/scripts/patch-vonuchkaa-start-menu.py
          python3 .github/scripts/patch-vonuchkaa-autopromo.py
          python3 .github/scripts/patch-vonuchkaa-premium.py
          python3 .github/scripts/patch-vonuchkaa-premium-hotfix.py
          python3 .github/scripts/patch-vonuchkaa-owner-access.py
          python3 .github/scripts/patch-vonuchkaa-premium-v2.py

      - name: Deploy vonuchkaa-ai-bot
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy vonuchkaa-ai-bot --project-ref wbqxposidtecxjioqufk --no-verify-jwt

      - name: Configure Telegram webhook
        run: |
          sleep 5
          RESPONSE=$(curl --silent --show-error "https://wbqxposidtecxjioqufk.supabase.co/functions/v1/vonuchkaa-ai-bot?setup=1")
          echo "$RESPONSE"
          echo "$RESPONSE" | grep -q '"ok":true'
