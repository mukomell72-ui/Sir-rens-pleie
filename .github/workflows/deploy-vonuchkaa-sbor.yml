name: Deploy Vonuchkaa /сбор command

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-vonuchkaa-sbor.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Ensure silence storage
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          SQL=$(cat <<'SQL'
          create table if not exists public.vonuchkaa_silence_chats (
            chat_id bigint primary key,
            enabled boolean not null default false,
            enabled_by bigint,
            updated_at timestamptz not null default now()
          );
          alter table public.vonuchkaa_silence_chats enable row level security;
          create index if not exists vonuchkaa_silence_enabled_idx
            on public.vonuchkaa_silence_chats (enabled, updated_at desc);
          SQL
          )
          PAYLOAD=$(jq -n --arg query "$SQL" '{query:$query}')
          curl --fail-with-body --silent --show-error \
            -X POST "https://api.supabase.com/v1/projects/wbqxposidtecxjioqufk/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"

      - name: Restore Vonuchkaa stable build inputs
        run: |
          git checkout 2ca022b117cb5a74d3b6bacb829b209f25676d9c -- supabase/functions/vonuchkaa-ai-bot .github/scripts
          git checkout 2acc0b3582219d218292cb756f26443ed8e38c00 -- .github/patches/patch-vonuchkaa-fish-voices.py .github/patches/patch-vonuchkaa-silence.py

      - name: Apply Vonuchkaa patches
        run: |
          python3 .github/scripts/patch-vonuchkaa-nicknames.py
          python3 .github/scripts/patch-vonuchkaa-post.py
          python3 .github/scripts/patch-vonuchkaa-start-menu.py
          python3 .github/scripts/patch-vonuchkaa-autopromo.py
          python3 .github/scripts/patch-vonuchkaa-premium.py
          python3 .github/scripts/patch-vonuchkaa-premium-hotfix.py
          python3 .github/scripts/patch-vonuchkaa-owner-access.py
          python3 .github/scripts/patch-vonuchkaa-premium-v2.py
          python3 .github/scripts/patch-vonuchkaa-voice.py
          python3 .github/scripts/patch-vonuchkaa-voice-hotfix.py
          python3 .github/scripts/patch-vonuchkaa-all.py
          python3 .github/scripts/patch-vonuchkaa-zov.py
          python3 .github/scripts/patch-vonuchkaa-who.py
          python3 .github/patches/patch-vonuchkaa-fish-voices.py
          python3 .github/patches/patch-vonuchkaa-silence.py

      - name: Add /сбор group announcement command
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('supabase/functions/vonuchkaa-ai-bot/index.ts')
          s = path.read_text(encoding='utf-8')

          helper = r'''
          async function handleSborCommand(msg: any, text: string) {
            if (!/^\/сбор(?:@\w+)?(?:\s|$)/iu.test(text)) return false;

            const group = ["group", "supergroup"].includes(String(msg?.chat?.type ?? ""));
            if (!group) {
              await reply(msg, "/сбор работает только в группе.");
              return true;
            }

            const chatId = Number(msg.chat.id);
            const userId = Number(msg?.from?.id);
            const level = await effectiveLevel(chatId, userId);
            if (level < 5) {
              await reply(msg, "/сбор доступен только администратору группы или модератору 5 уровня.");
              return true;
            }

            const announcement = text.replace(/^\/сбор(?:@\w+)?(?:\s+|$)/iu, "").trim();
            if (!announcement) {
              await reply(msg, "Формат: /сбор ваше сообщение");
              return true;
            }

            await rememberAllAdmins(chatId);
            const rows = await knownAllMembers(chatId);
            const unique = new Map<number, VonAllMember>();
            for (const row of rows) {
              const id = Number(row?.user_id);
              if (!id || row?.is_bot || id === userId) continue;
              unique.set(id, row);
            }
            const members = [...unique.values()];

            if (!members.length) {
              await reply(msg, "Пока не знаю участников этой группы. Бот запоминает их по сообщениям и входам в группу.");
              return true;
            }

            await sendAllMentionBatches(msg, announcement, members);
            return true;
          }
          '''

          anchor = '\nDeno.serve(async (req: Request) => {'
          if 'async function handleSborCommand' not in s:
              if anchor not in s:
                  raise SystemExit('Deno serve anchor not found')
              s = s.replace(anchor, '\n' + helper + anchor, 1)

          route_candidates = [
              '  if (await handleWhoCommand(msg, text)) return new Response("ok");',
              '  if (await handleZovCommand(msg, text)) return new Response("ok");',
              '  if (await handleAllMention(msg, text)) return new Response("ok");',
          ]
          if 'await handleSborCommand(msg, text)' not in s:
              for route_anchor in route_candidates:
                  if route_anchor in s:
                      s = s.replace(route_anchor, '  if (await handleSborCommand(msg, text)) return new Response("ok");\n' + route_anchor, 1)
                      break
              else:
                  raise SystemExit('routing anchor not found')

          path.write_text(s, encoding='utf-8')
          print('Vonuchkaa /сбор command applied')
          PY

      - name: Deploy vonuchkaa-ai-bot
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy vonuchkaa-ai-bot --project-ref wbqxposidtecxjioqufk --no-verify-jwt

      - name: Configure Telegram webhook
        run: |
          sleep 5
          RESPONSE=$(curl --silent --show-error "https://wbqxposidtecxjioqufk.supabase.co/functions/v1/vonuchkaa-ai-bot?setup=1")
          echo "$RESPONSE"
          echo "$RESPONSE" | grep -q '"ok":true'
