name: Deploy Vonuchkaa offadm card

"on":
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-vonuchkaa-offadm.yml
      - .github/patches/patch-vonuchkaa-offadm.py

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Download current deployed bot
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          rm -rf supabase/functions/vonuchkaa-ai-bot
          supabase functions download vonuchkaa-ai-bot --project-ref wbqxposidtecxjioqufk --use-api
          test -f supabase/functions/vonuchkaa-ai-bot/index.ts

      - name: Add offadm approval card
        run: python3 .github/patches/patch-vonuchkaa-offadm.py

      - name: Deploy bot
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy vonuchkaa-ai-bot --project-ref wbqxposidtecxjioqufk --no-verify-jwt --use-api

      - name: Configure Telegram webhook
        run: |
          sleep 5
          RESPONSE=$(curl --silent --show-error --max-time 30 "https://wbqxposidtecxjioqufk.supabase.co/functions/v1/vonuchkaa-ai-bot?setup=1" || true)
          echo "$RESPONSE"
          echo "$RESPONSE" | grep -q '"webhook":"Webhook was set"'
