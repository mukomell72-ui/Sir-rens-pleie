name: Deploy SIR Supabase database

on:
  workflow_dispatch:
  push:
    branches: [professional-redesign]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-supabase-db.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: Link new SIR project
        run: supabase link --project-ref fxdgeizhlhgvybclvmyo

      - name: Preview migrations
        run: supabase db push --linked --include-all --dry-run

      - name: Apply migrations
        run: supabase db push --linked --include-all

      - name: Show migration status
        run: supabase migration list --linked

      - name: Sync public frontend key and new project URLs
        shell: bash
        run: |
          set -euo pipefail
          KEYS_JSON="$(supabase projects api-keys --project-ref fxdgeizhlhgvybclvmyo -o json)"
          PUBLIC_KEY="$(KEYS_JSON="$KEYS_JSON" node <<'NODE'
          const data = JSON.parse(process.env.KEYS_JSON || '[]');
          const objects = [];
          const walk = (value) => {
            if (Array.isArray(value)) return value.forEach(walk);
            if (value && typeof value === 'object') {
              objects.push(value);
              Object.values(value).forEach(walk);
            }
          };
          walk(data);
          const stringValues = (obj) => Object.values(obj).filter((v) => typeof v === 'string');
          let key = '';
          for (const obj of objects) {
            if (obj.type === 'publishable') {
              key = stringValues(obj).find((v) => v.startsWith('sb_publishable_')) || '';
              if (key) break;
            }
          }
          if (!key) {
            for (const obj of objects) {
              if (obj.name === 'anon' || obj.type === 'anon') {
                key = stringValues(obj).find((v) => v.startsWith('eyJ')) || '';
                if (key) break;
              }
            }
          }
          if (!key) process.exit(2);
          process.stdout.write(key);
          NODE
          )"
          PUBLIC_KEY="$PUBLIC_KEY" node <<'NODE'
          const fs = require('fs');
          const path = 'assets/config.js';
          let text = fs.readFileSync(path, 'utf8');
          const key = process.env.PUBLIC_KEY;
          if (!key || !(key.startsWith('sb_publishable_') || key.startsWith('eyJ'))) {
            throw new Error('No usable public Supabase key found');
          }
          text = text.replace(/supabaseUrl:\s*"[^"]*"/, 'supabaseUrl: "https://fxdgeizhlhgvybclvmyo.supabase.co"');
          text = text.replace(/supabasePublishableKey:\s*"[^"]*"/, `supabasePublishableKey: "${key}"`);
          text = text.replace(/vehicleLookupUrl:\s*"[^"]*"/, 'vehicleLookupUrl: "https://fxdgeizhlhgvybclvmyo.supabase.co/functions/v1/vehicle-lookup"');
          text = text.replace(/photoUploadUrl:\s*"[^"]*"/, 'photoUploadUrl: "https://fxdgeizhlhgvybclvmyo.supabase.co/functions/v1/order-photo-upload"');
          fs.writeFileSync(path, text);
          NODE

      - name: Commit synced frontend config
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- assets/config.js; then
            echo "Frontend config already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/config.js
          git commit -m "config: connect frontend to new SIR Supabase project"
          git push origin HEAD:professional-redesign
