name: Deploy SIR Supabase database

on:
  workflow_dispatch:
  push:
    branches: [professional-redesign]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-supabase-db.yml'

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link new SIR project
        run: supabase link --project-ref fxdgeizhlhgvybclvmyo

      - name: Preview migrations
        run: supabase db push --linked --include-all --dry-run

      - name: Apply migrations
        run: supabase db push --linked --include-all

      - name: Show migration status
        run: supabase migration list --linked
