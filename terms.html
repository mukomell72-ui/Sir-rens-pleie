<!doctype html>

<body>

  <main class="section"><div class="shell" style="max-width:820px"><div class="eyebrow" id="eyebrow">Vilkår</div><h1 id="title">Vilkår for forespørsel og tjeneste</h1><p class="section-lead" id="lead"></p><div id="content"></div></div></main>
  <script>
  (()=>{
    const data={
      no:{back:'← Til nettsiden',eyebrow:'Vilkår',title:'Vilkår for forespørsel og tjeneste',lead:'Sist oppdatert 2. september 2026. Disse vilkårene begrenser ikke forbrukerens ufravikelige rettigheter.',sections:[
        ['Forespørsel – ikke bindende bestilling','Skjemaet på nettstedet sender en forespørsel. Innsending inngår ikke i seg selv en bindende avtale og medfører ingen betalingsplikt. Tidspunkt, omfang, endelig pris og øvrige vilkår må bekreftes separat av både kunden og SIR.'],
        ['Veiledende pris','Alle priser og beregninger på nettstedet er veiledende prisopplysninger basert på kundens valg. SIR bekrefter endelig pris etter kontroll av bilder og befaring av tilstand, materiale, størrelse, tilgjengelighet og risiko — før arbeidet starter. Ingen prisøkning eller tilleggsarbeid utføres uten kundens godkjenning.'],
        ['Hva tjenesten omfatter','Bare arbeidet som er uttrykkelig bekreftet inngår. Kunden skal før arbeidet opplyse om kjent skade, svakt lim, tidligere behandling, fargeavsmitting, ukjent materiale, ømfintlige overflater og andre forhold som kan påvirke sikker metode eller resultat. SIR kan stanse eller fraråde arbeid når risikoen er uforsvarlig.'],
        ['Resultat og eksisterende skade','SIR utfører avtalt arbeid fagmessig og med hensyn til materialet. Ingen bestemt flekk-, lukt- eller skadefjerning garanteres når resultatet påvirkes av alder, slitasje, tidligere behandling, varig misfarging, svak liming eller skjulte skader. Dette fritar ikke SIR for ansvar ved mangelfull eller uforsvarlig utførelse.'],
        ['Tilleggsarbeid','Behov for arbeid utenfor avtalt omfang skal beskrives og godkjennes av kunden før det utføres. Godkjenningen bør dokumentere omfang og pris. Lovbestemte regler om nødvendig tilleggsarbeid gjelder.'],
        ['Avbestilling og angrerett','Før en bindende avtale er bekreftet kan forespørselen trekkes kostnadsfritt. Ved fjernsalg av en tjeneste gjelder normalt 14 dagers angrerett fra avtaleinngåelsen. Dersom kunden uttrykkelig ber om oppstart før fristen, kan kunden ved bruk av angreretten måtte betale forholdsmessig for det som allerede er levert. Angreretten kan gå tapt når tjenesten er fullt utført, men bare når lovens krav til uttrykkelig forhåndssamtykke og erkjennelse er oppfylt. SIR skal gi lovpålagt informasjon og skriftlig avtalebekreftelse før arbeidet begynner.'],
        ['Reklamasjon','Meld fra så snart som mulig dersom du mener tjenesten har en mangel. SIR skal få en rimelig mulighet til å undersøke og, når loven krever det, rette forholdet. Kundens rettigheter følger ufravikelig norsk forbrukerlovgivning.'],
        ['Personvern og bilder','Kundedata og private ordrebilder brukes bare som beskrevet i personvernerklæringen. Bilder publiseres ikke eller brukes i markedsføring uten et separat, frivillig samtykke.'],
        ['Virksomhet under etablering','Offisielle ENK-fakturaer og regnskapsfunksjoner er sperret frem til virksomheten er registrert og nødvendige foretaksopplysninger kan oppgis. Inntil dette er på plass brukes nettstedet kun til uforpliktende forespørsler og prisvurdering.'],
        ['Kontakt','SIR Rens & Pleie, Kongsberg. Telefon: +47 93 95 35 81 eller +47 48 68 91 64. Fullstendig registrert foretaksnavn, organisasjonsnummer og forretningsadresse skal oppgis før en bindende betalt avtale inngås.']
      ]},
      en:{back:'← Back to site',eyebrow:'Terms',title:'Request and service terms',lead:'Last updated 2 September 2026. These terms do not limit mandatory consumer rights.',sections:[
        ['Request — not a binding order','The website form sends a request. Submission does not itself create a binding agreement or payment obligation. Appointment, scope, final price and other terms require separate confirmation by both the customer and SIR.'],
        ['Indicative price','All website prices and calculations are indicative and based on the customer’s selections. SIR confirms the final price after reviewing photos and inspecting condition, material, size, access and risk — before work begins. Price increases and additional work require customer approval.'],
        ['Scope and material risk','Only expressly confirmed work is included. The customer must disclose known damage, weak adhesive, prior treatment, colour transfer, unknown or sensitive materials and other relevant risks. SIR may stop or advise against unsafe work.'],
        ['Result and existing damage','SIR performs agreed work professionally and with regard to the material. Removal of every stain, odour or existing defect cannot be guaranteed where the result is affected by age, wear, earlier treatment, permanent discolouration, weak adhesive or hidden damage. This does not exclude liability for defective or negligent work.'],
        ['Additional work','Work outside the confirmed scope must be described and approved before it is performed, preferably with the scope and price documented. Mandatory statutory rules still apply.'],
        ['Cancellation and withdrawal','A request may be withdrawn free of charge before a binding agreement is confirmed. Distance service contracts normally have a 14-day withdrawal period. If the customer expressly requests early performance, proportionate payment may be due for work already supplied. The right may be lost after full performance only where statutory requirements for express prior consent and acknowledgement are met.'],
        ['Complaints','Notify SIR promptly if you believe the service is defective. SIR must have a reasonable opportunity to inspect and, where required by law, remedy the issue. Mandatory Norwegian consumer rights apply.'],
        ['Privacy and photos','Customer data and private order photos are used only as described in the privacy notice. Photos are not published or used for marketing without separate voluntary consent.'],
        ['Business registration pending','Official sole-proprietorship invoices and accounting functions remain blocked until registration and required business details are available. Until then the site is used only for non-binding requests and price assessments.'],
        ['Contact','SIR Rens & Pleie, Kongsberg. Phone: +47 93 95 35 81 or +47 48 68 91 64. The complete registered business name, organisation number and business address must be supplied before a binding paid agreement is concluded.']
      ]},
      ru:{back:'← На сайт',eyebrow:'Условия',title:'Условия заявки и услуги',lead:'Обновлено 2 сентября 2026 года. Эти условия не ограничивают обязательные права потребителя.',sections:[
        ['Заявка — не обязательный заказ','Форма на сайте отправляет заявку. Её отправка сама по себе не заключает договор и не создаёт обязанности оплаты. Дата, объём, окончательная цена и остальные условия требуют отдельного подтверждения клиента и SIR.'],
        ['Ориентировочная цена','Все цены и расчёты сайта ориентировочные и основаны на выборе клиента. SIR подтверждает окончательную цену после проверки фотографий и осмотра состояния, материала, размера, доступности и рисков — до начала работы. Повышение цены и дополнительные работы требуют согласия клиента.'],
        ['Объём и риски материала','В услугу входит только отдельно подтверждённая работа. Клиент сообщает об известных повреждениях, слабом клее, предыдущей обработке, переносе цвета, неизвестном или чувствительном материале и других рисках. SIR вправе остановить или не рекомендовать небезопасную обработку.'],
        ['Результат и существующие повреждения','SIR выполняет согласованную работу профессионально и с учётом материала. Нельзя гарантировать удаление каждого пятна, запаха или старого повреждения, если результат зависит от возраста, износа, прошлой обработки, стойкого изменения цвета, слабого клея или скрытых дефектов. Это не освобождает SIR от ответственности за ненадлежащее или неосторожное выполнение работы.'],
        ['Дополнительные работы','Работы вне подтверждённого объёма заранее описываются и согласовываются с клиентом; объём и цену следует зафиксировать. Обязательные требования закона сохраняются.'],
        ['Отмена и право отказа','До подтверждения обязательного договора заявку можно отозвать бесплатно. Для дистанционного договора услуги обычно действует 14-дневное право отказа. Если клиент прямо просит начать раньше, при отказе может потребоваться пропорциональная оплата уже выполненной части. Право может прекратиться после полного выполнения только при соблюдении требований закона о предварительном согласии и подтверждении клиента.'],
        ['Претензии','Сообщите SIR как можно скорее, если считаете услугу ненадлежащей. SIR должна получить разумную возможность осмотреть результат и, когда этого требует закон, устранить недостаток. Действуют обязательные права потребителя Норвегии.'],
        ['Конфиденциальность и фотографии','Данные клиента и приватные фотографии заказа используются только согласно политике конфиденциальности. Публикация и реклама допускаются только по отдельному добровольному согласию.'],
        ['Регистрация предприятия','Официальные счета ENK и бухгалтерские функции остаются заблокированными до регистрации и появления обязательных реквизитов. До этого сайт используется только для необязательных заявок и оценки цены.'],
        ['Контакты','SIR Rens & Pleie, Kongsberg. Телефон: +47 93 95 35 81 или +47 48 68 91 64. Полное зарегистрированное название, организационный номер и юридический адрес должны быть предоставлены до заключения обязательного платного договора.']
      ]}
    };
    const $=id=>document.getElementById(id);let lang=localStorage.getItem('sir_lang')||'no';if(!data[lang])lang='no';
    function render(){const d=data[lang];document.documentElement.lang=lang==='no'?'nb':lang;$('back').textContent=d.back;$('eyebrow').textContent=d.eyebrow;$('title').textContent=d.title;$('lead').textContent=d.lead;$('content').innerHTML=d.sections.map(([h,p])=>`<div class="info-card" style="margin-top:12px"><b>${h}</b><p>${p}</p></div>`).join('');document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));}
    document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>{lang=b.dataset.lang;localStorage.setItem('sir_lang',lang);render();}));render();
  })();
  </script>
</body>
</html>
