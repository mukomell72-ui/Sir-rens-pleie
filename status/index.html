<!doctype html><html lang="nb"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090d10"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>SIR Rens & Pleie — Ordrestatus</title><link rel="stylesheet" href="../assets/styles.css"><style>.status-wrap{max-width:680px;margin:auto;padding:24px 16px 70px}.status-card{background:#121a1f;border:1px solid #293942;border-radius:20px;padding:18px;margin-top:16px}.status-row{display:flex;justify-content:space-between;gap:20px;padding:11px 0;border-bottom:1px solid #ffffff0b}.status-row:last-child{border:0}.status-row span{color:#9fb0ba}.status-row b{text-align:right}.status-pill{display:inline-flex;padding:7px 10px;border-radius:999px;border:1px solid #36d3bf55;color:#8df2e1}.error{border-color:#ff747455;color:#ffc0c0}.langs{display:flex;gap:6px}.langs button{border:1px solid #293942;background:#121a1f;color:#9fb0ba;border-radius:999px;padding:7px 9px}.langs .active{border-color:#36d3bf;color:#fff}</style></head><body><main class="status-wrap"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px"><div class="brand">SIR Rens & Pleie<small>KONGSBERG</small></div><div class="langs"><button data-lang="no" class="active">NO</button><button data-lang="en">EN</button><button data-lang="ru">RU</button></div></div><div id="app"><div class="status-card">Laster ordrestatus…</div></div></main><script src="../assets/config.js"></script><script>
(()=>{const C=window.SIR_CONFIG,q=new URLSearchParams(location.search),orderNo=q.get('o')||'',token=q.get('t')||'',app=document.getElementById('app');let lang=localStorage.getItem('sir_lang')||'no';if(!['no','en','ru'].includes(lang))lang='no';const t={no:{title:'Ordrestatus',created:'Mottatt',service:'Tjeneste',status:'Status',estimate:'Foreløpig pris',final:'Avtalt pris',time:'Estimert arbeidstid',appt:'Avtalt tidspunkt',payment:'Betaling',none:'Ikke avtalt ennå',bad:'Statuslenken er ugyldig eller utløpt.',new:'Mottatt',under_review:'Under vurdering',offer_sent:'Tilbud sendt',awaiting_confirmation:'Venter på bekreftelse',confirmed:'Bekreftet',scheduled:'Planlagt',in_progress:'Arbeid pågår',completed:'Fullført',customer_requested_new_time:'Ønsker annet tidspunkt',cancelled_customer:'Avbestilt av kunde',cancelled_sir:'Avbestilt av SIR',no_show:'Ikke møtt / ingen tilgang',unpaid:'Ikke betalt',paid:'Betalt',refunded:'Refundert'},en:{title:'Order status',created:'Received',service:'Service',status:'Status',estimate:'Preliminary price',final:'Agreed price',time:'Estimated work time',appt:'Appointment',payment:'Payment',none:'Not agreed yet',bad:'This status link is invalid or has expired.',new:'Received',under_review:'Under review',offer_sent:'Offer sent',awaiting_confirmation:'Awaiting confirmation',confirmed:'Confirmed',scheduled:'Scheduled',in_progress:'In progress',completed:'Completed',customer_requested_new_time:'Another time requested',cancelled_customer:'Cancelled by customer',cancelled_sir:'Cancelled by SIR',no_show:'No-show / no access',unpaid:'Unpaid',paid:'Paid',refunded:'Refunded'},ru:{title:'Статус заказа',created:'Получен',service:'Услуга',status:'Статус',estimate:'Предварительная цена',final:'Согласованная цена',time:'Оценка времени работы',appt:'Запись',payment:'Оплата',none:'Пока не назначено',bad:'Ссылка статуса недействительна или срок её действия истёк.',new:'Получен',under_review:'На рассмотрении',offer_sent:'Предложение отправлено',awaiting_confirmation:'Ждёт подтверждения',confirmed:'Подтверждён',scheduled:'Запланирован',in_progress:'В работе',completed:'Выполнен',customer_requested_new_time:'Запрошено другое время',cancelled_customer:'Отменён клиентом',cancelled_sir:'Отменён SIR',no_show:'Неявка / нет доступа',unpaid:'Не оплачено',paid:'Оплачено',refunded:'Возврат'}};const tr=k=>t[lang][k]||k;document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>{lang=b.dataset.lang;localStorage.setItem('sir_lang',lang);document.querySelectorAll('[data-lang]').forEach(x=>x.classList.toggle('active',x===b));load();}));function money(v){return v==null?'—':new Intl.NumberFormat('nb-NO',{maximumFractionDigits:0}).format(+v)+' NOK'}function dt(v){if(!v)return tr('none');return new Intl.DateTimeFormat(lang==='ru'?'ru-RU':lang==='en'?'en-GB':'nb-NO',{weekday:'short',day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(v))}function mins(v){if(!v)return'—';const h=Math.floor(v/60),m=v%60;return `${h?h+' h ':''}${m?m+' min':''}`.trim()}async function load(){document.documentElement.lang=lang==='no'?'nb':lang;document.querySelectorAll('[data-lang]').forEach(x=>x.classList.toggle('active',x.dataset.lang===lang));if(!orderNo||!token){fail();return;}app.innerHTML='<div class="status-card">…</div>';try{const r=await fetch(`${C.supabaseUrl}/rest/v1/rpc/public_get_order_status`,{method:'POST',headers:{'Content-Type':'application/json','apikey':C.supabasePublishableKey},body:JSON.stringify({p_order_no:orderNo,p_token:token})});if(!r.ok)throw new Error();const d=await r.json();app.innerHTML=`<h1>${tr('title')}</h1><div class="status-card"><div class="status-row"><span>${tr('status')}</span><b><span class="status-pill">${tr(d.status)}</span></b></div><div class="status-row"><span>№</span><b>${d.order_no}</b></div><div class="status-row"><span>${tr('created')}</span><b>${dt(d.created_at)}</b></div><div class="status-row"><span>${tr('service')}</span><b>${d.service_type}</b></div><div class="status-row"><span>${tr('time')}</span><b>${mins(+d.estimated_minutes||0)}</b></div><div class="status-row"><span>${tr('estimate')}</span><b>${money(d.preliminary_price)}</b></div><div class="status-row"><span>${tr('final')}</span><b>${money(d.final_price)}</b></div><div class="status-row"><span>${tr('appt')}</span><b>${dt(d.appointment_start)}</b></div><div class="status-row"><span>${tr('payment')}</span><b>${tr(d.payment_status||'unpaid')}</b></div></div>`;}catch(_e){fail();}}function fail(){app.innerHTML=`<div class="status-card error">${tr('bad')}</div>`}load();})();
</script></body></html>
