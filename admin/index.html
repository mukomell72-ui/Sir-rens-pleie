<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a0f12"><title>SIR Admin</title><link rel="stylesheet" href="admin.css"></head><body><div id="login" class="login"><div class="logo">SIR Rens & Pleie<small>ADMIN</small></div><h1>Вход</h1><div id="setupNotice" class="notice">База SIR ещё не подключена к этой сборке.</div><form id="loginForm"><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label>Пароль</label><input id="password" type="password" autocomplete="current-password" required></div><details class="setup-details"><summary>Первый вход владельца</summary><div class="field"><label>Одноразовый код OWNER</label><input id="ownerCode" type="password" autocomplete="off" placeholder="Нужен только один раз"></div></details><button class="btn primary" type="submit">Войти</button></form><p class="mini">Пароли сотрудников не отображаются владельцу. Доступы управляются ролями.</p><details class="setup-details"><summary>Создать первый аккаунт OWNER</summary><form id="signupForm"><div class="field"><label>Имя</label><input id="signupName" required></div><div class="field"><label>Email</label><input id="signupEmail" type="email" autocomplete="email" required></div><div class="field"><label>Новый пароль</label><input id="signupPassword" type="password" autocomplete="new-password" minlength="8" required></div><div class="field"><label>Одноразовый код OWNER</label><input id="signupOwnerCode" type="password" autocomplete="off" required></div><button class="btn" type="submit">Создать OWNER</button><div id="signupStatus" class="mini"></div></form></details><button id="previewBtn" class="btn" type="button">Открыть безопасный предпросмотр</button></div>
<div id="app" class="app hidden"><header class="admin-top"><div class="logo">SIR Rens & Pleie<small>ADMIN</small></div><div><span id="roleBadge" class="badge">PREVIEW</span> <button id="logout" class="btn">Выйти</button></div></header><div class="layout"><aside class="side"><nav class="nav" id="nav"><button data-view="dashboard" class="active">Главная</button><button data-view="orders">Заказы</button><button data-view="calendar">Календарь</button><button data-view="customers">Клиенты</button><button data-view="guide">Справочник</button><a href="technology.html">Технолог</a><button data-view="finance">Финансы</button><a href="payments.html">Оплаты и рекомендации</a><button data-view="team">Команда</button><button data-view="audit">Журнал</button><button data-view="settings">Настройки</button><a href="backup.html">Резервная копия</a><a href="../assets/sir-master-qr.svg" target="_blank">QR SIR</a></nav></aside><main class="main" id="main"></main></div></div>
