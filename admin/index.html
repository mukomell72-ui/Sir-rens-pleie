<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a0f12"><title>SIR Admin</title><link rel="stylesheet" href="admin.css"></head><body><div id="login" class="login"><div class="logo">SIR Rens & Pleie<small>ADMIN</small></div><h1>Вход</h1><div id="setupNotice" class="notice">База SIR ещё не подключена к этой сборке. Интерфейс уже готов; подключение будет через Supabase Auth без общего PIN.</div><form id="loginForm"><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label>Пароль</label><input id="password" type="password" autocomplete="current-password" required></div><button class="btn primary" type="submit">Войти</button></form><p class="mini">Пароли сотрудников не отображаются владельцу. Доступы управляются ролями.</p><button id="previewBtn" class="btn" type="button">Открыть безопасный предпросмотр</button></div>
