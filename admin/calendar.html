<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a0f12"><title>SIR Календарь</title><link rel="stylesheet" href="admin.css"><style>.cal-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.cal-month{font-size:26px;font-weight:950}.cal-week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:14px}.cal-dow{color:var(--muted);font-size:12px;font-weight:900;text-align:center;padding:5px}.cal-cell{min-height:150px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:9px;overflow:hidden}.cal-cell.other{opacity:.35}.cal-date{font-weight:950;margin-bottom:7px}.cal-event,.cal-free{display:block;width:100%;border:0;border-radius:9px;padding:7px 8px;margin:5px 0;text-align:left;font-size:12px;cursor:pointer;color:var(--text)}.cal-event{background:#40a8d022}.cal-event.tentative{background:#f5c86122}.cal-event.confirmed,.cal-event.scheduled{background:#40a8d033}.cal-event.in_progress{background:#b895ff2b}.cal-event.completed{background:#ffffff10;color:var(--muted)}.cal-event.cancelled_customer,.cal-event.cancelled_sir,.cal-event.no_show{background:#ff727222}.cal-free{background:#62d49418;color:#baf4d1;border:1px dashed #62d49455}.dialog-back{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:16px;z-index:100}.dialog{width:min(620px,100%);max-height:90vh;overflow:auto;background:#0d151a;border:1px solid var(--line);border-radius:20px;padding:18px}.dialog-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:15px}.legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}.legend span{font-size:12px;color:var(--muted)}.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}@media(max-width:900px){.cal-week{grid-template-columns:1fr}.cal-dow{display:none}.cal-cell{min-height:80px}.cal-cell.other{display:none}}</style></head><body><header class="admin-top"><div class="logo">SIR Rens & Pleie<small>КАЛЕНДАРЬ</small></div><a class="btn" href="./">← Admin</a></header><main id="calendarApp" class="main" style="max-width:1450px;margin:auto"><div class="empty">Загрузка календаря…</div></main><script src="../assets/config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="calendar.js"></script></body></html>
