<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0a0f12"><title>SIR — первый OWNER</title><style>*{box-sizing:border-box}body{margin:0;background:#0a0f12;color:#f4f7f8;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.wrap{max-width:560px;margin:auto;padding:28px 18px 60px}.brand{font-weight:800;font-size:24px}.brand small{display:block;color:#99a6ad;font-size:12px;letter-spacing:.12em;margin-top:3px}.card{margin-top:24px;background:#12191d;border:1px solid #263239;border-radius:20px;padding:20px}.note{background:#152229;border:1px solid #2c4652;border-radius:14px;padding:13px;margin:14px 0;color:#d7e3e9}.field{margin:14px 0}label{display:block;font-size:13px;color:#aebbc1;margin-bottom:7px}input{width:100%;padding:14px 13px;border-radius:12px;border:1px solid #34434a;background:#0b1114;color:white;font-size:16px}button{width:100%;border:0;border-radius:13px;padding:15px;font-size:16px;font-weight:750;background:#eaf4f7;color:#071014;margin-top:8px}button.secondary{background:#1d2a30;color:#f4f7f8;border:1px solid #34434a}button:disabled{opacity:.55}.status{margin-top:14px;white-space:pre-wrap;line-height:1.45}.ok{color:#9fe0b5}.err{color:#ffadad}.muted{color:#92a0a7;font-size:13px;line-height:1.45}hr{border:0;border-top:1px solid #263239;margin:22px 0}</style></head><body><main class="wrap"><div class="brand">SIR Rens & Pleie<small>ПЕРВЫЙ OWNER · ЗАКРЫТАЯ НАСТРОЙКА</small></div><section class="card"><h1 style="font-size:24px;margin:0 0 10px">Создать владельца</h1><div class="note">Эта страница нужна только один раз. Код OWNER не хранится на странице и проверяется сервером Supabase.</div><div class="field"><label>Имя</label><input id="name" autocomplete="name"></div><div class="field"><label>Email</label><input id="email" type="email" autocomplete="email"></div><div class="field"><label>Новый пароль (минимум 8 символов)</label><input id="password" type="password" minlength="8" autocomplete="new-password"></div><div class="field"><label>Одноразовый код OWNER</label><input id="code" type="password" autocomplete="off"></div><button id="create">Создать / активировать OWNER</button><div id="status" class="status muted"></div><hr><div class="muted">Если аккаунт уже создан и письмо Supabase подтверждено, используйте те же email, пароль и OWNER-код и нажмите кнопку ниже.</div><button id="signin" class="secondary">Войти и активировать OWNER</button></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(()=>{const sb=window.supabase.createClient('https://fxdgeizhlhgvybclvmyo.supabase.co','sb_publishable_GvTM9nV_6kp1Vsfd1PajPg_q-Js5dzF',{auth:{persistSession:true}});const $=id=>document.getElementById(id),status=$('status');function vals(){return{name:$('name').value.trim(),email:$('email').value.trim(),password:$('password').value,code:$('code').value.trim()}}function msg(t,ok=false){status.textContent=t;status.className='status '+(ok?'ok':'err')}async function claim(code){const {error}=await sb.rpc('claim_initial_owner',{p_code:code});if(error)throw error;msg('Готово. Аккаунт активирован как OWNER. Можно закрыть эту страницу и продолжить настройку SIR.',true)}$('create').onclick=async()=>{const v=vals();if(!v.name||!v.email||v.password.length<8||!v.code){msg('Заполните все поля. Пароль — минимум 8 символов.');return}$('create').disabled=true;try{const {data,error}=await sb.auth.signUp({email:v.email,password:v.password,options:{data:{display_name:v.name}}});if(error)throw error;if(data.session){await claim(v.code)}else{msg('Аккаунт создан. Откройте письмо Supabase и подтвердите email. Затем вернитесь сюда и нажмите «Войти и активировать OWNER».',true)}}catch(e){msg(e.message||String(e))}finally{$('create').disabled=false}};$('signin').onclick=async()=>{const v=vals();if(!v.email||!v.password||!v.code){msg('Для входа нужны email, пароль и OWNER-код.');return}$('signin').disabled=true;try{const {error}=await sb.auth.signInWithPassword({email:v.email,password:v.password});if(error)throw error;await claim(v.code)}catch(e){msg(e.message||String(e))}finally{$('signin').disabled=false}}})();</script></body></html>
