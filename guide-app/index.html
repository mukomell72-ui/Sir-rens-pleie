"tags":["аромат","салон","After Shower"]},{"n":"Eikosha Air Spencer Pink Shower A42","c":"Ароматы","m":"A42","col":"#FFB3D6","f":"Ароматизатор салона.","d":"Готов к применению.","u":"Установить безопасно в салоне.","a":"Заменять по мере необходимости.","w":"Сначала устранить источник неприятного запаха.","p":"Получено 3 шт.","tags":["аромат","салон","Pink Shower"]},{"n":"Koch-Chemie Fresh Up, 1 л","c":"Салон","m":"FU","col":"#E91E78","f":"Нейтрализация запахов табака, животных, сырости/гниения в салоне и на текстиле.","d":"Не разводить.","u":"Сначала убрать источник запаха и очистить поверхность. Легко распылить на текстиль/поверхность или в помещение. Не переувлажнять.","a":"Дать поверхности полностью высохнуть и проветрить салон.","w":"Не маскирует источник загрязнения: перед применением запахообразующее загрязнение нужно удалить.","p":"260 kr","tags":["запах","табак","животные","текстиль","салон"]},{"n":"Koch-Chemie Eulex, 1 л","c":"Кузов","m":"EU","col":"#00A9C6","f":"Клей, смола, битум, следы резины, масло, жир, краска и маркер на стойких к растворителям поверхностях.","d":"Не разводить.","u":"Наносить только на стойкие поверхности. Лучше на салфетку, затем протереть загрязнение и удалить остатки. Перед работой тест на незаметном месте.","a":"После удаления загрязнения протереть поверхность чистой салфеткой; при наружной работе затем вымыть обработанную зону.","w":"Растворитель: обязательна проба на незаметном участке. Не применять на чувствительных к растворителям материалах.","p":"256 kr","tags":["клей","смола","битум","маркер","жир","растворитель"]},{"n":"Koch-Chemie Pol Star, 1 л","c":"Салон","m":"PS","col":"#9AD80E","f":"Ткань, сиденья, ковролин, алькантара и кожа.","d":"1:5–1:20; обычная уборка около 1:10.","u":"Нанести рабочий раствор, мягко проработать губкой/щёткой по направлению волокон. Остатки снять влажной микрофиброй или экстрактором.","a":"Удалить остатки средства и хорошо просушить материал.","w":"Перед обработкой кожи, алькантары и деликатной т const cats=['Все','Салон','Кузов','Пластик','Колёса','Ароматы','Оборудование','Расходники'];
let active='Все';
const q=document.getElementById('q'),chips=document.getElementById('chips'),list=document.getElementById('list'),count=document.getElementById('count');
function rc(){chips.innerHTML=cats.map(c=>`<button class="chip ${c===active?'active':''}" data-c="${c}">${c}</button>`).join('');chips.querySelectorAll('button').forEach(b=>b.onclick=()=>{active=b.dataset.c;rc();r()});}
function card(x){return `<article class="card"><div class="head"><div class="label" style="background:${x.col};color:${x.tc||'#111'}">${x.m}</div><div><div class="name">${x.n}</div><div class="mini">${x.f}</div></div><div class="arr">⌄</div></div><div class="body"><div class="sec"><b>Для чего</b><p>${x.f}</p></div><div class="sec"><b>Разведение</b><p>${x.d}</p></div><div class="sec"><b>Как пользоваться</b><p>${x.u}</p></div><div class="sec"><b>Что после</b><p>${x.a}</p></div><div class="sec"><b>Важно</b><p class="warn">${x.w}</p></div><div class="sec"><b>Цена / наличие</b><p class="price">${x.p}</p></div><div class="tags">${x.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div></div></article>`;}
function r(){const s=q.value.toLowerCase().trim();const f=items.filter(x=>(active==='Все'||x.c===active)&&(!s||[x.n,x.c,x.m,x.f,x.d,x.u,x.a,x.w,x.p,...x.tags].join(' ').toLowerCase().includes(s)));count.textContent=`Найдено ${f.length} из ${items.length}`;list.innerHTML=f.map(card).join('');list.querySelectorAll('.card').forEach(c=>c.querySelector('.head').onclick=()=>c.classList.toggle('open'));}
q.oninput=r;rc();r();
if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
